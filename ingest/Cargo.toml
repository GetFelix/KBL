[package]
name = "kbl-ingest"
version = "0.0.0"
description = "The ingest worker: pulls issues from upstream trackers into the work tracker and keeps them in step"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "kbl-ingest"
path = "src/main.rs"

[dependencies]
kbl-core = { path = "../core" }
anyhow = "=1.0.100"
axum = { version = "=0.8.8", default-features = false, features = ["http1", "json", "tokio"] }
clap = { version = "=4.5.51", features = ["derive", "env"] }
reqwest = { version = "=0.12.24", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread", "sync", "time", "net", "signal"] }

[dev-dependencies]
tokio = { version = "=1.48.0", features = ["test-util"] }
tower = { version = "=0.5.3", features = ["util"] }

[lints]
workspace = true
