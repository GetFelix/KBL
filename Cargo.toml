[workspace]
members = ["core", "wasm", "tool", "mcp", "tracker", "ingest", "metrics", "trace"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"

[workspace.lints.rust]
unreachable_pub = "warn"

[workspace.lints.clippy]
mod_module_files = "warn"
