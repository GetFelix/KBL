{{- if .Values.dashboard.enabled }}
{{- $name := printf "%s-dashboard" (include "kbl.fullname" .) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels: {{- include "kbl.labels" . | nindent 4 }}
data:
  # The image's own file forwards to a host called "tracker"; here the tracker
  # is this release's Service.
  default.conf: |
    server {
      listen 8080;
      root /usr/share/nginx/html;
      index index.html;

      location /v1/ {
        proxy_pass http://{{ include "kbl.fullname" . }}-tracker:{{ .Values.tracker.service.port }};
        # The tracker answers a work_next that waits, so give it room.
        proxy_read_timeout 60s;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: {{- include "kbl.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  replicas: {{ .Values.dashboard.replicas }}
  selector:
    matchLabels: {{- include "kbl.selector" (dict "root" . "component" "dashboard") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "kbl.labels" . | nindent 8 }}
        app.kubernetes.io/component: dashboard
      {{- with .Values.dashboard.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "kbl.fullname" . }}
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: dashboard
          image: {{ include "kbl.image" (dict "root" . "name" "kbl-dashboard") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            # nginx-unprivileged runs as uid 101.
            runAsUser: 101
            runAsGroup: 101
            {{- include "kbl.containerSecurity" . | nindent 12 }}
          ports:
            - { name: http, containerPort: 8080 }
          livenessProbe:
            httpGet: { path: /, port: http }
          readinessProbe:
            httpGet: { path: /, port: http }
          resources: {{- toYaml .Values.dashboard.resources | nindent 12 }}
          volumeMounts:
            - { name: nginx-conf, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: nginx-conf
          configMap: { name: {{ $name }} }
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
      {{- with .Values.dashboard.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dashboard.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dashboard.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{- include "kbl.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  selector: {{- include "kbl.selector" (dict "root" . "component" "dashboard") | nindent 4 }}
  ports:
    - { name: http, port: {{ .Values.dashboard.service.port }}, targetPort: http }
{{- end }}
