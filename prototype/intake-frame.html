<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KBL dashboard</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cstyle%3Epath%7Bfill:%2314171C%7D@media (prefers-color-scheme:dark)%7Bpath%7Bfill:%23ECEAE6%7D%7D%3C/style%3E%3Cpath d='M8 12H36V28H52V56H8Z'/%3E%3Crect fill='%23C86A1E' x='40' y='8' width='16' height='16'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080d13;
    --panel: #0d141c;
    --card: #121c26;
    --card-hover: #17242f;
    --line: rgba(160, 200, 220, 0.11);
    --line-strong: rgba(160, 200, 220, 0.22);
    --text: #e6eef4;
    --muted: #8496a5;
    --faint: #7a8d9c;
    /* KBL amber. --accent fills, borders and rings; --accent-ink is a lighter step so text stays 4.5:1 on tinted cards. */
    --accent: #c86a1e;
    --accent-soft: rgba(200, 106, 30, 0.16);
    --accent-ink: #e08a45;
    /* Chart series for agent-side time. Amber in a chart means a person, so the other side cannot be the accent. */
    --series: #7f9cb8;
    --amber: #ffd04d;
    --red: #ff7a7a;
    --on-amber: #1a1200;
    --amber-soft: hsla(45, 100%, 65%, 0.14);
    --on-accent: #14171c;
    --mark: #eceae6;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #f3f6f9;
    --panel: #ffffff;
    --card: #ffffff;
    --card-hover: #f1f7fa;
    --line: rgba(20, 50, 70, 0.10);
    --line-strong: rgba(20, 50, 70, 0.2);
    --text: #0e1a24;
    --muted: #566877;
    --faint: #5f7080;
    /* Amber itself is 3.8:1 on white, so the light theme uses darker steps that clear 4.5:1. */
    --accent: #a4520f;
    --accent-soft: rgba(164, 82, 15, 0.12);
    --accent-ink: #9a4a0c;
    --series: #4d6b88;
    --amber: #786700;
    --red: #c8302f;
    --on-amber: #ffffff;
    --amber-soft: hsla(52, 100%, 24%, 0.14);
    --on-accent: #ffffff;
    --mark: #14171c;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 500 13px/1.4 Inter, system-ui, sans-serif; }
  body { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
  button { font: inherit; color: inherit; background: transparent; border: 1px solid var(--line-strong); border-radius: 8px; height: 30px; padding: 0 10px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: 0.45; cursor: default; }
  .cb:focus-visible, .quick:focus-visible, #qlist:focus-visible, #list:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .cb:focus-visible { opacity: 1; }
  button:focus-visible, .row:focus-visible, .qrow:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  kbd { font: 600 10.5px/1 "JetBrains Mono", monospace; border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 4px; padding: 2px 5px; color: var(--text); background: var(--card); }

  header { flex: none; height: 52px; display: flex; align-items: center; gap: 14px; padding: 0 18px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; white-space: nowrap; }
  .mark { flex: none; display: block; width: 34px; height: 34px; fill: var(--mark); }
  .mark .bite { fill: #c86a1e; }
  .sep { width: 1px; height: 26px; background: var(--line-strong); }
  .tabs { display: flex; gap: 4px; align-self: stretch; align-items: stretch; }
  .tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; height: auto; padding: 0 12px; color: var(--muted); font-weight: 600; font-size: 13.5px; display: flex; align-items: center; gap: 7px; }
  .tabs button b { font: 600 12px "JetBrains Mono", monospace; background: var(--accent-soft); color: var(--accent-ink); border-radius: 999px; padding: 2px 7px; }
  .tabs button b:empty { display: none; }
  .tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
  .tabs button:hover { color: var(--text); border-color: transparent; border-bottom-color: var(--line-strong); }
  .tabs button[aria-selected="true"]:hover { border-bottom-color: var(--accent); }
  #theme { margin-left: auto; width: 34px; padding: 0; font-size: 15px; }

  #status { flex: none; position: relative; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 7px 18px; border-bottom: 1px solid var(--line); background: var(--bg); font-size: 12px; }
  #status .scope { color: var(--muted); margin-right: auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip { height: 26px; padding: 0 9px; border-radius: 999px; display: inline-flex; align-items: center; gap: 6px; font: 600 11.5px "JetBrains Mono", monospace; border: 1px solid var(--line-strong); color: var(--text); background: transparent; white-space: nowrap; }
  .chip small { font: 500 10.5px Inter, sans-serif; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .chip.warn { border-color: var(--amber); color: var(--amber); }
  .chip.full { background: var(--amber); border-color: var(--amber); color: var(--on-amber); }
  .chip.full small { color: inherit; }
  #srcpop { position: absolute; z-index: 20; top: 38px; right: 18px; width: 260px; display: none; flex-direction: column; gap: 6px; padding: 8px; background: var(--panel); border: 1px solid var(--line-strong); border-radius: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35); }
  #srcpop.open { display: flex; }

  #headline { flex: none; padding: 10px 18px 0; font-size: 14px; font-weight: 600; display: none; }
  #headline.on { display: block; }
  #headline span { color: var(--muted); font-weight: 500; }

  #nav { display: none; }
  main { flex: 1; min-height: 0; overflow: auto; padding: 14px 18px 18px; }
  .board { position: relative; padding-bottom: 24px; display: grid; grid-template-columns: repeat(7, minmax(150px, 1fr)); gap: 10px; align-items: start; min-width: min-content; }
  #links { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; z-index: 3; }
  #links path { fill: none; stroke: var(--accent); stroke-width: 1.75; opacity: 0.9; }
  #links path.far { stroke-dasharray: 3 4; opacity: 0.7; }
  #links circle { fill: var(--accent); }

  .col { min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: clip; }
  .col.you { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 18%, transparent); }
  .col.binding { border-color: var(--amber); box-shadow: 0 0 0 1px color-mix(in srgb, var(--amber) 30%, transparent); }
  .col > h2 { margin: 0; padding: 10px 12px 9px; display: flex; align-items: baseline; gap: 8px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); z-index: 2; }
  .col.you > h2 { color: var(--accent-ink); }
  .col > h2 .n { margin-left: auto; font: 600 20px/1 "JetBrains Mono", monospace; color: var(--text); letter-spacing: 0; }
  .oldest { padding: 6px 12px; font-size: 11.5px; color: var(--muted); border-bottom: 1px solid var(--line); }
  .oldest .l { display: flex; justify-content: space-between; }
  .oldest b { font: 600 11.5px "JetBrains Mono", monospace; color: var(--text); }
  .oldest .pc { display: block; margin-top: 1px; font: 500 10.5px "JetBrains Mono", monospace; color: var(--faint); }
  .oldest.warn b { color: var(--amber); }
  .oldest.hot b { color: var(--red); }
  .body { padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  .empty { color: var(--faint); padding: 14px 6px; text-align: center; font-size: 12px; }
  .banner { font-size: 11.5px; color: var(--amber); background: var(--amber-soft); border-radius: 8px; padding: 6px 8px; line-height: 1.35; }
  .tierhead { display: flex; align-items: baseline; gap: 8px; padding: 6px 4px 0; font-size: 11px; color: var(--muted); }
  .tierhead:first-child { padding-top: 0; }
  .tierhead .mono { color: var(--text); font-weight: 600; }
  .tierhead .tc { margin-left: auto; font: 500 11px "JetBrains Mono", monospace; }
  .tierhead.warn .tc { color: var(--amber); }
  .tierhead.hot .tc { color: var(--red); }
  .roots { display: flex; flex-direction: column; gap: 4px; padding-bottom: 6px; border-bottom: 1px dashed var(--line-strong); }
  .root { display: block; width: 100%; height: auto; text-align: left; padding: 5px 8px; font-size: 11.5px; line-height: 1.35; border-style: dashed; }
  .root b { font: 600 11.5px "JetBrains Mono", monospace; }
  .root em { font-style: normal; color: var(--accent-ink); font-weight: 600; }

  .row, .qrow { position: relative; display: block; width: 100%; height: auto; text-align: left; padding: 7px 9px 8px; background: var(--card); border: 1px solid var(--line); border-radius: 9px; }
  .row:hover, .qrow:hover { background: var(--card-hover); border-color: var(--line-strong); }
  .row .l1, .qrow .l1 { display: flex; align-items: center; gap: 5px; }
  .tag { white-space: nowrap; font: 600 9px/1 "JetBrains Mono", monospace; padding: 3px 4px; border-radius: 4px; border: 1px solid var(--line-strong); color: var(--muted); letter-spacing: 0.03em; }
  .ref { white-space: nowrap; font: 600 11.5px "JetBrains Mono", monospace; }
  .age { margin-left: auto; padding-left: 4px; font: 500 11px "JetBrains Mono", monospace; color: var(--muted); }
  .age.warn { color: var(--amber); }
  .age.hot { color: var(--red); }
  .title { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; margin-top: 4px; color: var(--text); font-size: 12.5px; line-height: 1.3; overflow: hidden; }
  .l3 { display: flex; align-items: center; gap: 6px; margin-top: 5px; min-width: 0; }
  .l3 .note { margin-top: 0; min-width: 0; flex: 1; }
  .note { display: block; margin-top: 3px; font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .note b { font: 600 11px "JetBrains Mono", monospace; color: var(--text); }
  .note.warn, .row.fail .note { color: var(--amber); }
  .note.dup { color: var(--amber); }
  .row.ask, .qrow.ask { border-left: 3px solid var(--accent); }
  .row.fail, .qrow.fail { border-left: 3px solid var(--amber); }
  .pill { font: 600 10px/1 "JetBrains Mono", monospace; padding: 3px 5px; border-radius: 999px; white-space: nowrap; }
  .pill.p0 { background: var(--accent); color: var(--on-accent); }
  .pill.p1 { border: 1px solid var(--accent); color: var(--accent-ink); }
  .pill.p2 { border: 1px solid var(--line-strong); color: var(--muted); }
  .pill.p3 { border: 1px dashed var(--line-strong); color: var(--faint); }
  .pill.cause { border: 1px solid var(--amber); color: var(--amber); }
  .pill.you { background: var(--accent-soft); color: var(--accent-ink); }
  .agent { color: var(--accent-ink); background: var(--accent-soft); border-radius: 5px; padding: 1px 6px; font: 600 11px "JetBrains Mono", monospace; }
  .more { height: 28px; font-size: 12px; color: var(--muted); border-style: dashed; }
  .row.snoozed, .qrow.snoozed { opacity: 0.6; }

  /* Selecting an item dims what is not in its chain. */
  .picked .row { opacity: 0.6; }
  .picked .row.chain, .picked .row.sel { opacity: 1; }
  .row.chain { border-color: color-mix(in srgb, var(--accent) 60%, var(--line)); }
  .row.sel, .qrow.sel { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 1px var(--accent); }

  .queue { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 14px; align-items: start; }
  #qlist { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .qrow .kind { font: 600 10px/1 Inter, sans-serif; text-transform: uppercase; letter-spacing: 0.07em; color: var(--accent-ink); }
  .qrow.fail .kind { color: var(--amber); }
  .qrow .title { -webkit-line-clamp: 1; line-clamp: 1; font-size: 13px; }
  .qrow .l1 .age { font-size: 11.5px; }
  .qfoot { color: var(--muted); font-size: 12px; padding: 6px 2px; }
  #side { position: sticky; top: 0; min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; outline: none; }
  #side .hint { color: var(--muted); font-size: 12.5px; line-height: 1.6; }

  .detail .head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .detail .head b.t { font-weight: 600; font-size: 14px; min-width: 0; flex-basis: 100%; }
  .detail .head .x { margin-left: auto; width: 26px; height: 26px; padding: 0; }
  .detail .meta { color: var(--muted); font-size: 12px; margin-top: 3px; }
  .detail .blk { margin-top: 10px; font-size: 12.5px; line-height: 1.45; }
  .detail .blk h4 { margin: 0 0 3px; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); font-weight: 600; }
  .detail .blk .kv { display: grid; grid-template-columns: 62px 1fr; gap: 2px 8px; }
  .detail .blk .kv > span:nth-child(odd) { color: var(--muted); }
  .detail .blk .unsure { color: var(--amber); }
  .detail .warn { color: var(--amber); }
  .detail .rated { color: var(--accent-ink); font-weight: 600; }
  .detail .chain { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px 6px; align-items: center; font-size: 12px; color: var(--muted); }
  .detail .chain button { height: 24px; padding: 0 8px; font: 600 11.5px "JetBrains Mono", monospace; }
  .detail .chain .gap { width: 8px; }
  .detail .chain .st { font: 500 11px Inter, sans-serif; color: var(--muted); }
  .detail a { color: var(--accent-ink); text-decoration: none; font-weight: 600; }
  .detail a:hover { text-decoration: underline; }
  .detail input[type="text"] { width: 100%; height: 32px; margin-top: 10px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--card); color: var(--text); font: 500 12.5px Inter, sans-serif; }
  .acts { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
  .acts button { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 600; }
  .acts button.primary { border-color: var(--accent); background: var(--accent-soft); }

  #dock { flex: none; border-top: 1px solid var(--line); background: var(--panel); padding: 10px 18px; display: none; max-height: 38dvh; overflow: auto; }
  #dock.open { display: block; }

  .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; align-items: start; }
  .metrics .wide { grid-column: span 2; }
  .mc { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px 14px; min-width: 0; }
  .mc h3 { margin: 0 0 8px; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; }
  .mc p { margin: 8px 0 0; font-size: 12px; color: var(--muted); line-height: 1.45; }
  .mc p b { color: var(--text); }
  .tiles { display: flex; gap: 18px; flex-wrap: wrap; }
  .tile small { display: block; color: var(--muted); font-size: 11px; }
  .tile b { font: 600 22px/1.2 "JetBrains Mono", monospace; }
  .tile b i { font-style: normal; font-size: 13px; color: var(--muted); font-weight: 500; }
  .mc svg { display: block; width: 100%; height: auto; }
  .mc svg text { font: 500 10.5px "JetBrains Mono", monospace; fill: var(--muted); }
  .mc svg text.lbl { font: 500 11px Inter, sans-serif; fill: var(--text); }
  .mc svg .ax { stroke: var(--line-strong); }
  .mc svg .b85 { fill: var(--series); opacity: 0.3; }
  .mc svg .b50 { fill: var(--series); }
  .mc svg .hum.b85 { fill: var(--amber); }
  .mc svg .hum.b50 { fill: var(--amber); opacity: 1; }
  .mc svg .arr { fill: var(--line-strong); }
  .mc svg .mrg { fill: var(--series); }
  .mc svg .mer { fill: var(--series); }
  .mc svg .rej { fill: var(--amber); }
  .foot-note { margin-top: 12px; color: var(--muted); font-size: 12px; }

  .src { background: var(--card); border: 1px solid var(--line); border-radius: 9px; padding: 8px 9px 9px; }
  .src .top { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 12.5px; }
  .src .srates { display: flex; gap: 12px; margin-top: 6px; font: 600 12px "JetBrains Mono", monospace; }
  .src .srates small { display: block; font: 500 10px Inter, sans-serif; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .src svg { display: block; width: 100%; height: 22px; margin-top: 6px; }
  .src svg rect { fill: var(--accent); opacity: 0.75; }
  .src svg line { stroke: var(--line-strong); }

  #events { flex: none; border-top: 1px solid var(--line); background: var(--panel); padding: 0 18px; font-size: 12px; }
  #events summary { cursor: pointer; padding: 6px 0; color: var(--muted); display: flex; gap: 8px; align-items: baseline; list-style: none; white-space: nowrap; overflow: hidden; }
  #events summary::-webkit-details-marker { display: none; }
  #events summary b { color: var(--text); font: 600 12px "JetBrains Mono", monospace; }
  #events summary .last { overflow: hidden; text-overflow: ellipsis; font: 500 11.5px "JetBrains Mono", monospace; color: var(--faint); }
  #events ol { margin: 0; padding: 0 0 8px; list-style: none; max-height: 22dvh; overflow: auto; font: 500 11.5px/1.7 "JetBrains Mono", monospace; color: var(--muted); }
  #events li b { color: var(--text); font-weight: 600; }
  #events li .o { color: var(--faint); margin-right: 8px; }

  footer { flex: none; border-top: 1px solid var(--line); background: var(--panel); padding: 9px 18px 11px; display: flex; flex-direction: column; gap: 7px; }
  footer .top { display: flex; gap: 6px 24px; justify-content: space-between; align-items: baseline; flex-wrap: wrap; }
  .bind { font-size: 12.5px; color: var(--muted); }
  .bind b { color: var(--text); font-weight: 600; }
  .bind .grow { color: var(--amber); }
  .bind button.lk { all: unset; cursor: pointer; color: var(--accent-ink); font-weight: 600; }
  .rates { display: flex; align-items: baseline; gap: 20px; flex-wrap: wrap; }
  .rates .m { font: 600 12.5px "JetBrains Mono", monospace; }
  .rates .m small { font: 500 11px Inter, sans-serif; color: var(--muted); margin-right: 5px; }
  .legend { display: flex; gap: 4px 10px; flex-wrap: wrap; color: var(--muted); font-size: 11px; align-items: center; }
  .legend span { display: inline-flex; gap: 5px; align-items: center; white-space: nowrap; }
  .scrub { display: flex; align-items: center; gap: 10px; }
  .scrub input { flex: 1; min-width: 0; accent-color: var(--accent); }
  .scrub .at { font: 500 12px "JetBrains Mono", monospace; color: var(--muted); min-width: 0; text-align: right; }
  #live { font: 600 12px Inter, sans-serif; }
  #live.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

  @media (max-width: 1100px) {
    .metrics .wide { grid-column: auto; }
  }
  @media (max-width: 760px) {
    header { height: 48px; padding: 0 10px; gap: 8px; }
    #status { padding: 6px 12px; gap: 6px; }
    #status .scope, #status .chip.open { display: none; }
    #headline { padding: 8px 12px 0; font-size: 13px; }
    #nav { display: none; flex: none; gap: 6px; overflow-x: auto; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); scrollbar-width: none; }
    #nav.on { display: flex; }
    #nav::-webkit-scrollbar { display: none; }
    #nav a { flex: none; display: flex; align-items: baseline; gap: 6px; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line-strong); color: var(--muted); font-size: 12px; font-weight: 600; text-decoration: none; }
    #nav a b { font: 600 13px "JetBrains Mono", monospace; color: var(--text); }
    #nav a.you { border-color: var(--accent); }
    #nav a.you b { color: var(--accent-ink); }
    main { padding: 10px 12px 14px; }
    .board { display: flex; flex-direction: column; align-items: stretch; gap: 10px; min-width: 0; }
    #links { display: none; }
    .col > h2 { position: static; }
    .metrics .mc.wide { grid-column: auto; }
    #srcpop { right: 12px; left: 12px; width: auto; }
    #dock { padding: 10px 12px; max-height: 42dvh; }
    #events { padding: 0 12px; }
    footer { padding: 8px 12px 10px; gap: 6px; }
    .legend { display: none; }
    .rates { gap: 4px 14px; }
  }

  /* ---------- decision replay ---------- */
  .marks { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
  .mk { display: inline-flex; align-items: center; gap: 4px; height: 18px; padding: 0 6px; border-radius: 999px; font: 600 10.5px/1 "JetBrains Mono", monospace; border: 1px solid var(--line-strong); color: var(--muted); background: transparent; white-space: nowrap; }
  .mk.paths { color: var(--accent-ink); border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
  .mk.handoff { color: var(--accent-ink); background: var(--accent-soft); border-color: transparent; cursor: pointer; }
  .mk.handoff:hover { border-color: var(--accent); }
  .mk.q { color: var(--amber); border-color: var(--amber); }
  .mk.qa { color: var(--muted); }
  button.mk { height: 18px; }

  #v-replay { display: none; }
  body.replaying footer, body.replaying #headline { display: none; }
  .rhead { display: flex; align-items: center; gap: 8px 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .rhead .back { width: 30px; padding: 0; font-size: 15px; }
  .rhead .tt { font-weight: 600; font-size: 15px; flex: 1 1 260px; min-width: 0; }
  .rhead .meta { color: var(--muted); font-size: 12px; flex-basis: 100%; margin: -4px 0 0 40px; }
  .rhead .ra { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; align-items: center; }
  .rhead .ra button.primary { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; font-size: 12px; }
  .redocount { font: 600 11.5px "JetBrains Mono", monospace; color: var(--muted); }
  .redocount.full { color: var(--amber); }
  .rgrid { display: flex; flex-direction: column; gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px 14px; min-width: 0; }
  .card > h3 { margin: 0 0 10px; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; display: flex; align-items: baseline; gap: 10px; }
  .card > h3 .hint { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 500; font-size: 11.5px; color: var(--faint); }
  .rcols { display: grid; grid-template-columns: minmax(0, 1fr) 390px; gap: 12px; align-items: start; }
  #explain { position: sticky; top: 0; }
  .banner.limit { margin-bottom: 12px; font-size: 12.5px; padding: 8px 12px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .banner.limit b { color: var(--text); }
  .banner.limit .acts { margin: 0 0 0 auto; }

  /* the path */
  .path { position: relative; display: flex; flex-direction: column; gap: 4px; }
  .forks { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  .forks path { fill: none; stroke: var(--accent); stroke-width: 1.75; stroke-dasharray: 4 3; opacity: 0.85; }
  .lane { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 0 8px; padding: 6px 0 7px; border-top: 1px solid var(--line); }
  .lane:first-of-type { border-top: 0; }
  .lane.off .dots, .lane.off .fk { opacity: 0.62; }
  .lab { grid-row: 1 / span 2; text-align: left; height: auto; border: 0; padding: 2px 0; display: flex; flex-direction: column; gap: 3px; align-items: flex-start; min-width: 0; border-radius: 6px; }
  .lab:hover { border: 0; }
  .lab b { font-size: 12px; font-weight: 600; }
  .lab.on b { color: var(--accent-ink); }
  .lab .agent { font-size: 10.5px; padding: 0 5px; }
  .out { font: 600 10px/1 "JetBrains Mono", monospace; padding: 3px 6px; border-radius: 999px; border: 1px solid var(--line-strong); color: var(--muted); white-space: nowrap; }
  .out.run, .out.pub { color: var(--accent-ink); border-color: var(--accent); }
  .out.rev { color: var(--on-accent); background: var(--accent); border-color: var(--accent); }
  .out.draft { border-style: dashed; color: var(--muted); }
  .out.rej { color: var(--amber); border-color: var(--amber); }
  .out.ok { color: var(--on-accent); background: var(--accent); border-color: var(--accent); }
  .dots { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); align-items: center; height: 30px; }
  .cellp { position: relative; display: flex; justify-content: center; align-items: center; height: 30px; }
  .cellp::before { content: ""; position: absolute; top: 14px; height: 2px; left: 0; right: 0; background: var(--line-strong); }
  .cellp.first::before { left: 50%; }
  .cellp.last::before { right: 50%; }
  .cellp.alone::before { display: none; }
  .dot { position: relative; z-index: 1; width: 20px; height: 20px; min-width: 20px; padding: 0; border-radius: 50%; border: 2px solid var(--accent); background: var(--panel); font: 600 9.5px/1 "JetBrains Mono", monospace; color: var(--accent-ink); display: grid; place-items: center; }
  .dot.past { background: var(--accent); color: var(--on-accent); }
  .dot.off { border-color: var(--line-strong); color: var(--muted); }
  .dot.past.off { background: var(--line-strong); color: var(--text); }
  .dot.flag { box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--amber); }
  .dot.cur { box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--text); }
  .dot.cur.flag { box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--amber), 0 0 0 6px var(--panel), 0 0 0 7px var(--text); }
  .dot.start { border-style: dashed; background: var(--panel); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.45; } }
  @media (prefers-reduced-motion: reduce) { .dot.start { animation: none; } }
  .term { position: relative; z-index: 1; width: 14px; height: 14px; border-radius: 3px; border: 2px solid var(--line-strong); background: var(--panel); }
  .term.rev, .term.ok { background: var(--accent); border-color: var(--accent); }
  .term.run, .term.pub { border-color: var(--accent); }
  .term.draft { border-style: dashed; border-color: var(--muted); }
  .term.rej { background: var(--amber); border-color: var(--amber); }
  .fk { margin-top: 2px; font-size: 11.5px; color: var(--muted); line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; padding-left: var(--fkpad, 0); grid-column: 2; }
  .ft { background: var(--panel); box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  .lane > * { position: relative; z-index: 1; }
  .fk b { color: var(--text); font-weight: 600; }
  .scrubrow { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .scrubrow .rs { position: relative; flex: 1 1 200px; min-width: 0; height: 26px; }
  .scrubrow .rs input { position: absolute; inset: 0; width: 100%; margin: 0; accent-color: var(--accent); }
  .scrubrow .tk { position: absolute; top: 0; width: 2px; height: 6px; background: var(--faint); pointer-events: none; transform: translateX(-1px); }
  .scrubrow .tk.d { background: var(--accent); height: 8px; }
  .scrubrow .tk.fl { background: var(--amber); }
  .scrubrow .at { font: 500 12px "JetBrains Mono", monospace; color: var(--muted); }
  .scrubrow .kh { flex-basis: 100%; font-size: 11.5px; color: var(--faint); }

  /* explanation */
  #explain .sec { margin-top: 12px; }
  #explain .sec:first-of-type { margin-top: 0; }
  #explain h4 { margin: 0 0 4px; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); font-weight: 600; }
  #explain .sent { margin: 0 0 5px; font-size: 13px; line-height: 1.45; }
  #explain .opts { margin: 4px 0 0; padding: 0; list-style: none; font-size: 12px; color: var(--muted); }
  #explain .opts li::before { content: "– "; }
  #explain .opts li.pick { color: var(--text); }
  #explain .opts li.pick::before { content: "✓ "; color: var(--accent-ink); }
  #explain .idle { color: var(--muted); font-size: 12.5px; line-height: 1.55; }
  #explain .src { margin-top: 12px; padding-top: 8px; border-top: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-bottom: 0; border-radius: 0; font-size: 11.5px; color: var(--faint); }
  #explain.dragging .sec, #explain.dragging .src { opacity: 0.25; }

  .who { font: 600 10.5px/1 "JetBrains Mono", monospace; color: var(--amber); border: 1px solid var(--amber); border-radius: 5px; padding: 1px 5px; margin-right: 3px; white-space: nowrap; vertical-align: 1px; }
  .nar li .who { flex: none; margin: 3px 0 0; }
  .cite { display: inline-block; height: 18px; padding: 0 5px; margin: 0 1px; vertical-align: 1px; font: 600 10.5px/16px "JetBrains Mono", monospace; color: var(--accent-ink); background: var(--accent-soft); border: 1px solid transparent; border-radius: 5px; cursor: pointer; }
  .cite:hover { border-color: var(--accent); }
  .cite.on { background: var(--accent); color: var(--on-accent); }
  .stepcard { margin-top: 8px; padding: 8px 10px; border: 1px solid var(--line-strong); border-radius: 9px; background: var(--card); font-size: 12px; line-height: 1.45; }
  .stepcard .k { font: 600 10.5px "JetBrains Mono", monospace; color: var(--accent-ink); }
  .stepcard .r { color: var(--muted); }

  /* story */
  .tabsr { display: flex; gap: 4px; margin: -4px 0 10px; border-bottom: 1px solid var(--line); }
  .tabsr button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; height: 30px; padding: 0 10px; color: var(--muted); font-weight: 600; }
  .tabsr button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
  .flagstrip { border: 1px solid var(--amber); background: var(--amber-soft); border-radius: 9px; padding: 8px 10px; margin-bottom: 12px; font-size: 12.5px; }
  .flagstrip b { color: var(--amber); }
  .flagstrip ul { margin: 4px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 3px; }
  .flagstrip li { line-height: 1.4; }
  .grp { margin-top: 12px; }
  .grp:first-of-type { margin-top: 0; }
  .grp > h4 { margin: 0 0 4px; display: flex; gap: 8px; align-items: baseline; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); font-weight: 600; }
  .grp > h4 span { font: 500 10.5px "JetBrains Mono", monospace; color: var(--faint); letter-spacing: 0; }
  .dec { border: 1px solid var(--line); border-radius: 9px; background: var(--card); margin-bottom: 5px; }
  .dec.off { opacity: 0.6; }
  .dec.sel { border-color: var(--accent); }
  .dec summary { list-style: none; cursor: pointer; padding: 7px 9px; display: flex; gap: 8px; align-items: baseline; font-size: 12.5px; line-height: 1.35; }
  .dec summary::-webkit-details-marker { display: none; }
  .dec summary .an { font: 600 10px "JetBrains Mono", monospace; color: var(--muted); border: 1px solid var(--line-strong); border-radius: 4px; padding: 2px 4px; flex: none; }
  .dec summary .ch { min-width: 0; flex: 1; }
  .dec summary .ch b { font-weight: 600; }
  .dec summary .ch small { display: block; color: var(--muted); font-size: 11.5px; }
  .dec .body2 { padding: 0 9px 9px 9px; font-size: 12.5px; line-height: 1.45; display: flex; flex-direction: column; gap: 5px; }
  .dec .body2 .why { color: var(--text); }
  .dec .body2 ul { margin: 0; padding: 0; list-style: none; color: var(--muted); font-size: 12px; }
  .dec .body2 li { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
  .fl { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: 999px; font: 600 10px/1 "JetBrains Mono", monospace; color: var(--amber); border: 1px solid var(--amber); white-space: nowrap; }
  .fl.note { color: var(--on-amber); background: var(--amber); }
  .orph { border: 1px dashed var(--amber); border-radius: 9px; padding: 6px 9px; margin-bottom: 5px; font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .rate { display: flex; gap: 6px; align-items: center; margin-top: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .rate .rated { color: var(--accent-ink); font-weight: 600; }
  .qs { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
  .qs h4 { margin: 0 0 6px; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); font-weight: 600; }
  .qa { border: 1px solid var(--line); border-radius: 9px; background: var(--card); padding: 8px 10px; margin-bottom: 6px; font-size: 12.5px; line-height: 1.45; }
  .qa .who { color: var(--muted); font-size: 11.5px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .qa .ans { margin-top: 5px; }
  .qform { display: flex; gap: 6px; margin-top: 6px; }
  .qform input { flex: 1; min-width: 0; height: 32px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--card); color: var(--text); font: 500 12.5px Inter, sans-serif; }
  .qs .fine { margin-top: 5px; color: var(--faint); font-size: 11.5px; }

  /* side by side */
  .cmp { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .cmp .col2 { border: 1px solid var(--line); border-radius: 10px; background: var(--card); padding: 10px 11px; min-width: 0; }
  .cmp .col2.now { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
  .cmp .ch2 { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-weight: 600; font-size: 13px; }
  .cmp .ch2 .out { margin-left: auto; }
  .cmp dl { margin: 8px 0 0; display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 4px 8px; font-size: 12px; }
  .cmp dt { color: var(--muted); }
  .cmp dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  .cmp .diffbar { display: inline-flex; gap: 1px; vertical-align: middle; margin-left: 4px; }
  .cmp .diffbar i { width: 5px; height: 9px; display: block; background: var(--accent); }
  .cmp .diffbar i.d { background: var(--amber); }
  .cmp .pick { margin-top: 10px; }
  .cmpnote { margin-top: 10px; font-size: 12.5px; line-height: 1.45; padding: 8px 10px; border-radius: 9px; background: var(--accent-soft); }
  .cmpnote b { font-weight: 600; }
  .detail .cmp { grid-template-columns: repeat(2, minmax(0, 1fr)); margin-top: 8px; }
  .detail .cmp dl { grid-template-columns: 48px minmax(0, 1fr); font-size: 11.5px; }
  .detail .pl { display: flex; flex-direction: column; gap: 3px; font-size: 12px; }
  .detail .pl div { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }


  /* autoplay demo overlays */
  #demo-cap, #demo-key { position: fixed; z-index: 60; bottom: 150px; display: none; align-items: center; gap: 10px; border-radius: 12px; border: 1px solid var(--line-strong); background: color-mix(in srgb, var(--panel) 92%, transparent); backdrop-filter: blur(8px); box-shadow: 0 8px 28px rgba(0, 0, 0, 0.28); pointer-events: none; opacity: 0; }
  #demo-cap { left: 50%; transform: translateX(-50%); padding: 10px 20px; font: 600 17px Inter, sans-serif; white-space: nowrap; }
  #demo-key { right: 28px; bottom: 58px; padding: 5px 12px; font: 500 14px Inter, sans-serif; color: var(--muted); }
  #demo-key kbd { font-size: 14px; }
  body.demo #demo-cap, body.demo #demo-key { display: flex; }
  body.demo { cursor: none; }
  body.demo #events { display: none; }
  body.demo .legend { visibility: hidden; }
  .bsep { color: var(--faint); }
  #go.pressed { transform: scale(0.96); }

  /* dialogs */
  #modal { position: fixed; inset: 0; z-index: 50; display: none; background: rgba(2, 8, 14, 0.62); align-items: center; justify-content: center; padding: 16px; }
  #modal.open { display: flex; }
  .dlg { width: min(640px, 100%); max-height: 100%; overflow: auto; background: var(--panel); border: 1px solid var(--line-strong); border-radius: 14px; box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45); padding: 16px 18px 18px; }
  .dlg h2 { margin: 0; font-size: 16px; }

  .dlg h4 { margin: 14px 0 5px; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); font-weight: 600; display: flex; gap: 8px; align-items: baseline; }
  .dlg h4 span { text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--faint); font-size: 11.5px; }

  .dlg label.chk input { margin-top: 2px; accent-color: var(--accent); }

  @media (max-width: 1100px) {

  /* ---------- shell: sidebar, top bar, list, side panel ---------- */

    const k = waitKind(it);
    if (k) rows.push({ it, kind: k });
    else if (it.stage !== 'done' && it.stage !== 'closed' && ((it.snoozeUntil && it.snoozeUntil > cut) || it.parked) && ['needs', 'triage', 'review'].includes(it.stage)) snoozed++;
  }
  const bucket = (r) => Math.floor((cut - r.it.waitSince) / HOUR);
  rows.sort((a, b) => bucket(b) - bucket(a) || (a.it.tier ?? a.it.proposal?.tier ?? 9) - (b.it.tier ?? b.it.proposal?.tier ?? 9) || a.it.key.localeCompare(b.it.key));
  const kinds = {};
  for (const r of rows) kinds[r.kind] = (kinds[r.kind] ?? 0) + 1;
  return { rows, snoozed, kinds };
}

// Roots of what blocks an item: unfinished dependencies that are not blocked themselves.
function rootsOf(st, it, seen = new Set()) {
  const out = new Set();
  for (const d of it.deps) {
    const o = st.items.get(d);
    if (!o || o.done || it.resolved.has(d) || seen.has(d)) continue;
    seen.add(d);
    if (o.stage === 'blocked') for (const x of rootsOf(st, o, seen)) out.add(x); else out.add(d);
  }
  return out;
}
function blockRoots(st, blockedItems) {
  const m = new Map();
  for (const it of blockedItems) for (const r of rootsOf(st, it)) m.set(r, true);
  return [...m.keys()].map((k) => {
    const o = st.items.get(k);
    const holds = [...chainOf(st, k).down].filter((d) => !st.items.get(d).done && !st.items.get(d).closed).length;
    return { it: o, holds };
  }).sort((a, b) => b.holds - a.holds);
}

// The stage that is slowest to move, with a cause that names it.
function constraintOf(byStage, busy, agents, roots) {
  const cap = settings.reviewCap;
  const humanReview = byStage.review.filter((it) => waitingOf(it) !== 'agent');
  const oldest = (arr) => (arr.length ? cut - arr[0].since : 0);
  const cands = [];
  const add = (stage, label, arr, text, boost = 1) => { if (arr.length) cands.push({ stage, label, text, score: boost * oldest(arr) / stats[stage].p85 }); };
  add('review', 'review', humanReview, `${plural(byStage.review.length, 'PR')} in review, ${humanReview.length} waiting on a person, oldest ${span(oldest(humanReview))}`);
  const tri = byStage.triage.filter((it) => it.proposal);
  add('triage', 'triage', tri, `${plural(tri.length, 'proposal')} waiting for your accept, oldest ${span(oldest(tri))}`);
  add('needs', 'needs you', byStage.needs, `${plural(byStage.needs.length, 'item')} waiting on an answer or a decision, oldest ${span(oldest(byStage.needs))}`);
  add('blocked', 'blocked', byStage.blocked, roots.length ? `${plural(byStage.blocked.length, 'item')} behind ${roots[0].it.ref}, which holds up ${roots[0].holds}` : `${plural(byStage.blocked.length, 'item')} blocked`);
  const full = cap != null && byStage.review.length >= cap;
  if (byStage.ready.length && busy < agents && !full) add('ready', 'claim path', byStage.ready, `${agents - busy} of ${agents} agents idle while ${byStage.ready.length} ${byStage.ready.length === 1 ? 'is' : 'are'} ready`, 2);
  if (full) { const c = cands.find((x) => x.stage === 'review'); if (c) c.score = 1e9; }
  cands.sort((a, b) => b.score - a.score);
  return cands[0] ?? null;
}

// ---------- rendering ----------

// Rows are options in a listbox that keeps focus; the selected one is its active descendant.
function syncListbox() {
  for (const id of ['qlist', 'list']) {
    const box = $(id), rows = box.querySelectorAll('[role="option"][data-k]');
    box.setAttribute('role', 'listbox'); box.tabIndex = 0;
    if (id === 'list') box.setAttribute('aria-label', 'All work');
    let on = null;
    rows.forEach((r, i) => { r.id = `${id}-o${i}`; if (r.dataset.k === selected) on = r.id; });
    if (on) box.setAttribute('aria-activedescendant', on); else box.removeAttribute('aria-activedescendant');
  }
}
function renderNow() {
  const a = document.activeElement, again = a?.closest?.('#main') && (a.dataset.check ? `[data-check="${CSS.escape(a.dataset.check)}"]` : a.dataset.quick ? `[data-quick="${a.dataset.quick}"][data-k="${CSS.escape(a.dataset.k)}"]` : null);
  state = fold(cut);
  by = summarize(state);
  stats = stageStats(state);
  queue = buildQueue(state);
  if (selected && !state.items.has(selected)) selected = null;
  for (const k of checked) if (!state.items.has(k)) checked.delete(k);
  const chain = selected ? chainOf(state, selected) : null;
  const busy = by.held.filter((it) => !it.human).length, agents = fx.agents.length;
  const blockedRoots = blockRoots(state, by.blocked);
  binding = constraintOf(by, busy, agents, blockedRoots);

  for (const v of VIEWS) $('v-' + v).style.display = v === view ? '' : 'none';
  document.body.dataset.view = view;
  document.body.classList.remove('loading');
  $('main').classList.toggle('anychecked', checked.size > 0);
  $('v-replay').style.display = view === 'replay' ? 'block' : 'none';
  document.body.classList.toggle('replaying', view === 'replay');
  $('nav').classList.toggle('on', view === 'board');
  document.title = `${queue.rows.length ? `(${queue.rows.length}) ` : ''}KBL: ${{ queue: 'My queue', list: 'All work', board: 'Board', metrics: 'Metrics', replay: 'Story' }[view]}`;

  renderSidebar();
  renderTop();
  renderStatus(busy, agents);
  if (view === 'queue') renderQueue();
  else if (view === 'list') renderList();
  else if (view === 'board') renderBoard(chain, blockedRoots, busy, agents);
  else if (view === 'replay') renderReplay();
  else renderMetrics();
  renderHeadline();
  renderPanel(chain);
  renderFloat();
  renderEvents();
  renderFooter(busy, agents);
  $('legend').innerHTML = [['j k', 'move'], ['x', 'select'], ['1-9', 'choose'], [`${MOD}↵`, 'main action'], ['s', 'status'], ['p', 'tier'], ['a', 'assign'], ['h', 'snooze'], [`${MOD}K`, 'commands'], ['?', 'all keys']]
    .map(([k, t]) => `<span><kbd>${k}</kbd>${t}</span>`).join('');
  const live = cut >= NOW;
  $('at').textContent = live ? '' : `${span(NOW - cut)} ago`;
  $('live').classList.toggle('on', live);
  $('scrub').max = NOW;
  $('scrub').value = cut;
  lastInfo = { colInfo: colInfoOf(), open: [...state.items.values()].filter((it) => it.stage !== 'done' && it.stage !== 'closed').length, busy };
  syncListbox();
  if (again) $('main').querySelector(again)?.focus({ preventScroll: true });
  syncUrl();
  root.dataset.ready = '1';
}

function colInfoOf() {
  const oldestOf = (arr) => (arr.length ? arr.reduce((a, b) => (a.since <= b.since ? a : b)) : null);
  const out = {};
  for (const [stage] of STAGES) {
    const arr = by[stage];
    const old = stage === 'done' ? null : oldestOf(arr);
    out[stage] = { count: arr.length, oldest: old ? cut - old.since : 0, oldestRef: old?.ref ?? null };
  }
  return out;
}

function renderStatus(busy, agents) {
  const srcRows = Object.entries(fx.sources).map(([id, s]) => {
    const mine = [...state.items.values()].filter((it) => it.source === id);
    const h1 = mine.filter((it) => cut - it.at <= HOUR).length;
    const d1 = mine.filter((it) => cut - it.at <= DAY).length;
    const open = mine.filter((it) => it.stage !== 'done' && it.stage !== 'closed').length;
    const bins = Array(24).fill(0);
    for (const it of mine) { const b = Math.floor((cut - it.at) / HOUR); if (b >= 0 && b < 24) bins[23 - b]++; }
    const peak = Math.max(1, ...bins);
    const bars = bins.map((n, i) => n ? `<rect x="${i * 10 + 1}" width="8" y="${22 - Math.max(2, n / peak * 22)}" height="${Math.max(2, n / peak * 22)}" rx="1.5"></rect>` : '').join('');
    return { d1, html: `<div class="src"><div class="top"><span class="tag">${esc(s.tag)}</span>${esc(s.label)}</div>` +
      `<div class="srates"><span><small>1h</small>+${h1}</span><span><small>24h</small>+${d1}</span><span><small>open</small>${open}</span></div>` +
      `<svg viewBox="0 0 240 22" preserveAspectRatio="none" role="img" aria-label="Arrivals per hour, last 24 hours"><line x1="0" x2="240" y1="21.5" y2="21.5"></line>${bars}</svg></div>` };
  });
  const arrivals = sum(srcRows.map((r) => r.d1));
  const cap = settings.reviewCap, inRev = by.review.length;
  const full = cap != null && inRev >= cap, near = cap != null && inRev >= Math.ceil(cap * 0.8);
  const capChip = cap == null ? '' : full
    ? `<span class="chip full" id="capchip" title="Soft limit: agents stop claiming new work until a PR leaves review. Triage, answers and reviews carry on.">review full: agents paused, ${inRev}/${cap}</span>`
    : `<span class="chip${near ? ' warn' : ''}" id="capchip" title="Soft limit on agent PRs in review. At the limit agents stop claiming. It is a setting with no evidence behind its default."><small>review</small>${inRev}/${cap}</span>`;
  const open = [...state.items.values()].filter((it) => it.stage !== 'done' && it.stage !== 'closed').length;
  $('status').innerHTML = `<div id="fchips">${filterChips()}</div>` +
    `<button class="chip" id="srcbtn" aria-expanded="false" aria-controls="srcpop"><small>sources</small>+${arrivals}/24h</button>${capChip}` +
    `<span class="chip"><small>agents busy</small>${busy}/${agents}</span><span class="chip open"><small>open</small>${open}</span>` +
    `<div id="srcpop" role="dialog" tabindex="-1" aria-label="Arrivals by source">${srcRows.map((r) => r.html).join('')}</div>`;
}

function renderHeadline() {
  const h = $('headline');
  h.classList.toggle('on', view === 'queue' || view === 'metrics');
  if (view === 'queue') {
    const q = queue.rows;
    if (!q.length) { h.innerHTML = `Nothing is waiting on you.`; return; }
    const o = q[0], k = KIND_LABEL[o.kind].toLowerCase();
    h.innerHTML = `${q.length} waiting on you. <span>Oldest is ${/^[aeiou]/.test(k) ? 'an' : 'a'} ${k}, ${span(cut - o.it.waitSince)}. Ordered by age, then tier.</span>`;
  } else if (view === 'metrics') h.innerHTML = metricsHeadline;
}

function ageHtml(it, stage) {
  const a = cut - it.since;
  return `<span class="age ${stage && stage !== 'done' ? ageClass(stage, a) : ''}">${span(a)}</span>`;
}
const tagHtml = (it) => `<span class="tag">${esc(fx.sources[it.source].tag)}</span>`;
const tierOf = (it) => pending.get(it.key) ?? it.tier ?? it.proposal?.tier;
const pillHtml = (it, tier = it.tier) => (tier == null ? '' : `<span class="pill p${tier}">P${tier}</span>`);
const reviewState = (it) => {
  const w = waitingOf(it);
  if (w === 'agent') return it.pr.ci === 'fail' ? `CI red, ${it.pr.agent} fixing` : `changes asked, ${it.pr.agent} on it`;
  if (w === 'unassigned') return 'CI green, no reviewer';
  if (w === 'merge') return `approved, not merged (${it.reviewer === viewer ? 'you' : it.reviewer})`;
  return `waits on ${it.reviewer === viewer ? 'you' : it.reviewer}`;
};
const PR_CLASS = { agent: 'back', unassigned: 'noreviewer', merge: 'approved', reviewer: 'waits' };
const prBadge = (it) => `<span class="prs ${PR_CLASS[waitingOf(it)]}">${esc(reviewState(it))}</span>`;
// The two review states that only need one click from a person.
function quickHtml(it) {
  if (it.stage !== 'review' || cut < NOW) return '';
  const w = waitingOf(it);
  if (w === 'unassigned') return `<span class="quick" role="button" tabindex="0" data-quick="request_review" data-k="${esc(it.key)}">Request review</span>`;
  if (w === 'merge') return `<span class="quick" role="button" tabindex="0" data-quick="open" data-k="${esc(it.key)}">Open to merge</span>`;
  return '';
}
const stIcon = (stage) => `<i class="sti s-${stage}" aria-hidden="true"></i>`;
const cbHtml = (k) => `<span class="cb${checked.has(k) ? ' on' : ''}" data-check="${esc(k)}" tabindex="${k === selected ? 0 : -1}" role="checkbox" aria-checked="${checked.has(k)}" aria-label="Select"></span>`;
const reviewSize = (it) => `+${it.pr.add} −${it.pr.del} · ${it.pr.files} ${it.pr.files === 1 ? 'file' : 'files'} · CI ${it.pr.ci}${it.rounds ? ` · round ${it.rounds + 1}` : ''}`;

function noteFor(it, stage) {
  if (stage === 'needs') {
    if (it.gaveUp) return { cls: 'fail', pill: `<span class="pill cause">${esc(it.cause)}</span>`, notes: [`${it.fails ? `failed ${it.fails}x: ` : ''}${esc(it.msg || it.gaveUp)}`] };
    return { cls: 'ask', pill: '', notes: [`asks: ${esc(it.asked)}`] };
  }
  if (stage === 'triage') {
    const p = it.proposal;
    if (!p) return { cls: '', pill: '', notes: ['no triage proposal yet'] };
    const dup = p.dup ? `<span class="note dup">maybe a duplicate of <b>${esc(state.items.get(p.dup)?.ref ?? p.dup)}</b></span>` : '';
    return { cls: '', pill: pillHtml(it, tierOf(it)), notes: [`why P${tierOf(it)}: ${esc(p.why)}`], extra: dup + (p.agent ? `<span class="note">proposed by <b>${esc(p.agent)}</b></span>` : '') };
  }
  if (stage === 'ready' && it.paths?.at(-1)?.handoff && it.paths.at(-1).state === 'published') {
    const b = it.paths.at(-1);
    return { cls: '', pill: pillHtml(it), notes: [`attempt ${b.n}, redone from attempt ${b.parent}`] };
  }
  if (stage === 'blocked') {
    const open = it.deps.filter((d) => !it.resolved.has(d) && !state.items.get(d)?.done).map((d) => state.items.get(d).ref);
    return { cls: '', pill: pillHtml(it), notes: [`waits on <b>${esc(open.join(', '))}</b>`] };
  }
  if (stage === 'held') return { cls: '', pill: pillHtml(it), notes: [`<span class="agent">${esc(it.holder)}</span> since ${span(cut - it.claimedAt)}${it.steers ? ` · ${it.steers} ${it.steers === 1 ? 'note' : 'notes'} sent` : ''}`] };
  if (stage === 'review') return { cls: '', pill: pillHtml(it), notes: [prBadge(it), esc(reviewSize(it))], extra: quickHtml(it) };
  if (stage === 'done') return { cls: '', pill: '', notes: [`${esc(it.by)} <b>PR ${esc(it.prNum)}</b>`] };
  return { cls: '', pill: '', notes: [] };
}

// Small chips on a card: how many paths it took, an open handoff, a question.
function marksHtml(it) {
  const m = [];
  if ((it.paths?.length ?? 0) > 1) m.push(`<span class="mk paths" title="Attempts that branched from each other">${it.paths.length} paths</span>`);
  const cur = it.paths?.at(-1);
  if (cur?.handoff && ['published', 'running'].includes(cur.state)) m.push(`<span class="mk handoff" role="button" tabindex="0" data-handoff="${cur.n}" data-hk="${esc(it.key)}" title="Open the handoff the new attempt starts from">redo · handoff</span>`);
  const open = (it.questions ?? []).filter((q) => !q.answer).length;
  if (open) m.push(`<span class="mk q">${open} ${open === 1 ? 'question' : 'questions'}</span>`);
  return m.length ? `<span class="marks">${m.join('')}</span>` : '';
}

function rowHtml(it, stage, chain) {
  const n = noteFor(it, stage);
  let cls = 'row ' + n.cls;
  if (it.key === selected) cls += ' sel'; else if (chain?.all.has(it.key)) cls += ' chain';
  if (checked.has(it.key)) cls += ' checked';
  if (it.parked || (it.snoozeUntil && it.snoozeUntil > cut)) cls += ' snoozed';
  const l3 = (n.pill || n.notes.length) ? `<span class="l3">${n.pill}<span class="note">${n.notes[0] ?? ''}</span></span>` : '';
  const more = (n.notes.slice(1).map((x) => `<span class="note">${x}</span>`).join('')) + (n.extra ?? '');
  const you = it.human ? '<span class="pill you">you</span>' : '';
  return `<button class="${cls}" data-k="${esc(it.key)}" data-stage="${stage}" aria-pressed="${it.key === selected}" title="${esc(it.title)}">` +
    `<span class="l1">${cbHtml(it.key)}${tagHtml(it)}<span class="ref">${esc(it.ref)}</span>${you}${ageHtml(it, stage)}</span>` +
    `<span class="title">${esc(it.title)}</span>${l3}${more}${marksHtml(it)}</button>`;
}

function emptyState(kind) {
  if (kind === 'filter') return `<div class="emptyst"><h3>No items match</h3><p>Nothing here fits the filters or the search. Loosen one, or clear them all.</p><div class="acts"><button data-clearf>Clear filters</button></div></div>`;
  const held = by.held.filter((it) => !it.human).length, rev = by.review.length;

    `<p>Nothing is waiting on you. Agents hold ${plural(held, 'item')} and ${plural(rev, 'pull request')} ${rev === 1 ? 'is' : 'are'} in review with someone else. New questions, failures and reviews land here.</p>` +
    `<div class="acts"><button data-go="board">Open the board <kbd>g</kbd><kbd>b</kbd></button></div></div>`;
}

function renderQueue() {
  const rows = queue.rows.filter((r) => matches(r.it));
  const show = expanded.has('queue') ? rows : rows.slice(0, QUEUE_CAP);
  let html = show.map(({ it, kind }) => {
    const stage = it.stage;
    let note;
    if (kind === 'question') {
      const o = it.options ?? [];
      note = `<span class="opts">${o.map((x, i) => `<span class="opt${x === it.def ? ' def' : ''}"><kbd>${i + 1}</kbd>${esc(x)}${x === it.def ? '<i>default</i>' : ''}</span>`).join('')}<span class="opt other"><kbd>${o.length + 1}</kbd>${o.length ? 'Other' : 'Type an answer'}</span></span>`;
    } else if (kind === 'failure') note = `<span class="note"><span class="pill cause">${esc(it.cause)}</span> ${esc(it.msg || it.gaveUp)}</span>`;
    else if (kind === 'triage') note = `<span class="note">${pillHtml(it, tierOf(it))} ${esc(it.proposal.why)}${it.proposal.dup ? ` · <b>possible duplicate of ${esc(state.items.get(it.proposal.dup)?.ref ?? it.proposal.dup)}</b>` : ''}</span>`;
    else note = `<span class="note">${prBadge(it)} ${esc(reviewSize(it))}${quickHtml(it)}</span>`;
    const cls = `qrow ${kind === 'question' ? 'ask' : kind === 'failure' ? 'fail' : ''}${it.key === selected ? ' sel' : ''}${checked.has(it.key) ? ' checked' : ''}`;
    const age = cut - it.waitSince;
    return `<div class="${cls}" data-k="${esc(it.key)}" data-kind="${kind}" role="option" aria-selected="${it.key === selected}">${cbHtml(it.key)}` +
      `<span class="kind">${KIND_LABEL[kind]}</span><span class="qmain"><span class="l1"><span class="ref">${esc(it.ref)}</span><span class="ti">${esc(kind === 'question' ? it.asked : it.title)}</span>${marksHtml(it)}</span>` +
      `${kind === 'question' ? `<span class="note">${esc(it.title)}</span>` : ''}${note}</span>` +

}

// The same items as the board, one per line. Grouping and order come from the Display menu.
function renderList() {
  const items = STAGES.flatMap(([s]) => by[s]).filter(matches);
  const sorters = {
    age: (a, b) => (a.stage === 'done') - (b.stage === 'done') || (a.stage === 'done' ? b.since - a.since : a.since - b.since),
    tier: (a, b) => (tierOf(a) ?? 9) - (tierOf(b) ?? 9) || a.since - b.since,
    newest: (a, b) => b.at - a.at,
  };
  const groups = group === 'stage' ? STAGES.map(([s, n]) => [s, n, items.filter((it) => it.stage === s), s])
    : group === 'tier' ? [0, 1, 2, 3, null].map((t) => [`t${t}`, t == null ? 'No tier yet' : `P${t}`, items.filter((it) => (tierOf(it) ?? null) === t)])
    : group === 'source' ? Object.entries(fx.sources).map(([id, x]) => [id, x.label, items.filter((it) => it.source === id)])
    : [['all', 'All items', items]];
  const row = (it) => {
    const n = noteFor(it, it.stage), who = it.human ? 'you' : it.holder ?? it.pr?.agent ?? '';

    return `<div class="${cls}" data-k="${esc(it.key)}" data-stage="${it.stage}" role="option" aria-selected="${it.key === selected}">${cbHtml(it.key)}${stIcon(it.stage)}` +
      `<span class="ref mono">${esc(it.ref)}</span><span class="ti">${esc(it.title)}</span>${marksHtml(it)}` +
      `<span class="st">${it.stage === 'review' ? '' : n.pill.includes('cause') ? n.pill : ''}<span class="note">${n.notes[0] ?? ''}</span></span>${quickHtml(it)}` +
      `<span class="asg">${who ? `<span class="${who === 'you' ? 'pill you' : 'agent'}">${esc(who)}</span>` : ''}</span><span class="tc">${pillHtml(it, tierOf(it))}</span>${tagHtml(it)}${ageHtml(it, it.stage)}</div>`;
  };
  let html = '';
  for (const [id, name, arr, stage] of groups) {
    if (!arr.length) continue;

      const old = arr.reduce((a, b) => (a.since <= b.since ? a : b)), st = stats[stage];

    } else if (stage) pc = `<span class="pc">last 24 hours</span>`;

      shown.map(row).join('') +
      (arr.length > LIST_CAP ? (open ? `<button class="more" data-less="${key}">show fewer</button>` : `<button class="more" data-more="${key}">${arr.length - LIST_CAP} more</button>`) : '');
  }
  $('list').innerHTML = html || emptyState('filter');
}

function renderBoard(chain, blockedRoots, busy, agents) {
  const list = (arr, stage, key, cap) => {
    const shown = [];
    let hidden = 0;
    for (const it of arr) (shown.length < cap || chain?.all.has(it.key) || expanded.has(key)) ? shown.push(it) : hidden++;
    return shown.map((it) => rowHtml(it, stage, chain)).join('') +
      (hidden ? `<button class="more" data-more="${key}">${hidden} more</button>` : '') +
      (expanded.has(key) && arr.length > cap ? `<button class="more" data-less="${key}">show fewer</button>` : '');
  };
  const cols = [];
  const cap = settings.reviewCap, full = cap != null && by.review.length >= cap;
  for (const [stage, name] of STAGES) {
    const arr = by[stage].filter(matches);
    const old = stage === 'done' ? null : arr[0];
    const age = old ? cut - old.since : 0;
    const cls = old ? ageClass(stage, age) : '';
    const s = stats[stage];
    const oldLine = stage === 'done'
      ? `<div class="oldest"><div class="l"><span>last 24 hours</span><b>${arr.length}</b></div></div>`
      : `<div class="oldest ${cls}"><div class="l"><span>oldest${old ? ` ${esc(old.ref)}` : ''}</span><b>${old ? span(age) : 'none'}</b></div><span class="pc">${s.own ? `p50 ${span(s.p50)} · p85 ${span(s.p85)}` : `no history yet`}</span></div>`;
    let body;
    if (!arr.length) body = `<div class="empty">Nothing here</div>`;
    else if (stage === 'ready') {
      body = [0, 1, 2, 3].map((t) => {
        const tier = arr.filter((it) => it.tier === t);
        if (!tier.length) return '';
        const o = tier[0], a = cut - o.since;
        return `<div class="tierhead ${ageClass('ready', a)}"><span class="pill p${t}">P${t}</span><span>${tier.length}</span><span class="tc">oldest ${span(a)}</span></div>` + list(tier, 'ready', `ready:${t}`, TIER_CAP);
      }).join('');
    } else if (stage === 'needs') {
      const groups = [['question', arr.filter((it) => it.asked)], ...['redo limit', 'tests red', 'timeout', 'claim lost', 'gave up'].map((c) => [c, arr.filter((it) => !it.asked && it.cause === c)])];
      body = groups.filter(([, g]) => g.length).map(([c, g]) => `<div class="tierhead"><span class="mono">${c === 'question' ? 'questions' : esc(c)}</span><span>${g.length}</span></div>` + list(g, 'needs', `needs:${c}`, CAP)).join('');
    } else if (stage === 'blocked') {
      const roots = blockedRoots.slice(0, 3).map(({ it, holds }) =>
        `<button class="root" data-k="${esc(it.key)}"><b>${esc(it.ref)}</b> ${esc(STAGE_NAME[it.stage].toLowerCase())}${it.holder ? ` · ${esc(it.holder)}` : ''} · <em>holds up ${holds}</em></button>`).join('');
      body = (roots ? `<div class="roots">${roots}</div>` : '') + list(arr, stage, stage, CAP);
    } else body = list(arr, stage, stage, CAP);
    if (stage === 'ready' && full) body = `<div class="banner">Agents paused: review is full (${by.review.length}/${cap}). Ready work waits for a PR to leave review.</div>` + body;
    cols.push(`<section class="col${stage === 'needs' ? ' you' : ''}${binding?.stage === stage ? ' binding' : ''}" id="c-${stage}" data-stage="${stage}"><h2>${stIcon(stage)}${name}<span class="n">${arr.length}</span></h2>${oldLine}<div class="body">${body}</div></section>`);
  }
  const board = $('board');
  board.className = 'board' + (chain ? ' picked' : '');
  board.innerHTML = `<svg id="links" aria-hidden="true"></svg>` + cols.join('');
  $('nav').innerHTML = STAGES.map(([k, n]) => `<a href="#c-${k}" data-nav="${k}"${k === 'needs' ? ' class="you"' : ''}>${n} <b>${by[k].length}</b></a>`).join('');
  requestAnimationFrame(() => { if (!chain || [...chain.all].every((k) => state.items.has(k))) drawLinks(chain); });
}

function renderFooter() {
  const inDay = [...state.items.values()].filter((it) => cut - it.at <= DAY).length;
  const outDay = [...state.items.values()].filter((it) => it.done && cut - it.doneAt <= DAY).length;
  const net = inDay - outDay;
  const growth = net <= 0 ? ` <b>Draining.</b>` : ` <b class="grow">Growing by ${net} a day.</b>`;
  const why = binding ? `Binding stage, <b>${esc(binding.label)}</b>: ${binding.text}. <button class="lk" data-bind="${binding.stage}">Show it</button>` : 'Nothing is waiting long.';
  $('bind').innerHTML = binding ? `${why} <span class="bsep">·</span>${growth}` : `${why}${growth}`;
  const oldReady = by.ready[0];
  $('rates').innerHTML = `<span class="m"><small>in</small>${inDay}/day</span><span class="m"><small>out</small>${outDay}/day</span>` +
    `<span class="m"><small>oldest ready</small>${oldReady ? `${span(cut - oldReady.since)} (${esc(oldReady.ref)})` : 'none'}</span>`;
}

function renderEvents() {
  $('evn').textContent = localEvents.length;
  const fmt = (r) => { const { o, t, kind, item, ...rest } = r; return `<span class="o">#${o}</span><b>${esc(kind)}</b> ${esc(item)} ${esc(Object.entries(rest).map(([k, v]) => `${k}=${typeof v === 'object' ? JSON.stringify(v) : v}`).join(' '))}`; };
  $('evlast').textContent = localEvents.length ? (() => { const r = localEvents[localEvents.length - 1]; return `${r.kind} ${r.item}`; })() : 'none yet';
  $('evlist').innerHTML = [...localEvents].reverse().map((r) => `<li>${fmt(r)}</li>`).join('') || `<li>What you do is listed here as the records it writes.</li>`;
}

// ---------- the selected item: facts and actions ----------

function storyBlock(it) {
  if (!hasHistory(it)) return '';
  const flags = allFlags(it), decs = itemRecs(it.key).filter((r) => r.kind === 'decision').length;
  const lanes = lanesOf(it);
  const opens = it.paths.filter((b) => OPEN_ATT.includes(b.state));
  const list = it.paths.length > 1
    ? `<div class="pl">${it.paths.map((b) => `<div><b>Attempt ${b.n}</b><span class="agent">${esc(b.agent ?? '-')}</span><span class="out ${OUTCOME[b.state]?.[1] ?? ''}">${esc(outcomeOf(b))}</span>${b.pr ? `<span class="meta">PR ${b.pr.n}${b.state === 'draft' ? ' draft' : ''}</span>` : ''}${b.parent ? `<span class="meta">from decision ${lanes.find((l) => l.b.n === b.n).base}, ${esc(b.by)}</span>` : ''}${b.handoff ? `<button class="mk handoff" data-handoff="${b.n}" data-hk="${esc(it.key)}">redo · handoff</button>` : ''}</div>`).join('')}</div>` : '';
  const q = (it.questions ?? []).map((x) => `<span class="mk ${x.answer ? 'qa' : 'q'}">question · ${x.answer ? 'answered' : 'open'}</span>`).join(' ');
  return `<div class="blk"><h4>Story</h4>${plural(decs, 'decision')} across ${plural(it.paths.length, 'attempt')}${flags.length ? `, <span class="warn">${plural(flags.length, 'place')} where claims and steps disagree</span>` : ''}. <kbd>Enter</kbd> opens it. ${q}${list}${opens.length >= 2 ? compareHtml(it, true) : ''}</div>`;
}

function detailHtml(it, chain) {
  const stage = it.stage;
  const kv = (rows) => `<div class="kv">${rows.map(([k, v]) => `<span>${k}</span><span>${v}</span>`).join('')}</div>`;
  let body = '';
  if (stage === 'triage') {
    const p = it.proposal;
    if (!p) body = `<div class="blk">No triage work item has been completed for this yet.</div>`;
    else {
      const t = tierOf(it);
      const deps = p.on.map((k) => state.items.get(k)?.ref ?? k);
      const d = p.dup && state.items.get(p.dup);
      body = `<div class="blk"><h4>Proposed by ${esc(p.agent ?? 'an agent')} · a triage work item it completed</h4>${kv([['tier', `${pillHtml(it, t)}${pending.has(it.key) ? ' (edited)' : ''}`], ['why', esc(p.why)], ['after', deps.length ? esc(deps.join(', ')) : 'nothing']])}</div>` +
        (d ? `<div class="blk warn">Possible duplicate of <b>${esc(d.ref)}</b> (${esc(fx.sources[d.source].label)}): ${esc(d.title)}. <kbd>2</kbd> merges this into it.</div>` : '');
    }
  } else if (stage === 'needs') {
    body = it.asked
      ? `<div class="qcard"><div class="qhead"><span class="kind">Question</span>${it.unclear ? `<span class="mk q">unclear: ${esc(it.unclear)}</span>` : ''}<span class="meta">${it.unclear ? 'triage could not tell · ' : ''}waiting ${span(cut - it.since)}</span></div>` +
        `<p class="qtext">${esc(it.asked)}</p><div class="qopts">` +
        (it.options ?? []).map((o, i) => `<button class="${o === it.def ? 'def' : ''}" data-act="opt${i + 1}"${cut >= NOW ? '' : ' disabled'}><kbd>${i + 1}</kbd><span>${esc(o)}</span>${o === it.def ? `<i>default <kbd class="mod">${MOD}↵</kbd></i>` : ''}</button>`).join('') +
        `<label class="other"><kbd>${(it.options?.length ?? 0) + 1}</kbd><input type="text" id="note" placeholder="${it.options?.length ? 'Other: type an answer, then Enter' : 'Type an answer, then Enter'}" aria-label="Another answer" autocomplete="off"></label></div>` +
        `<div class="fine">Your answer is recorded as you give it. An agent picks the work up again from it.</div></div>`
      : it.cause === 'redo limit' ? `<div class="blk"><h4>Redo limit reached · ${it.redos} of ${redoLimit()} used</h4>${esc(it.msg)}</div>`
      : `<div class="blk"><h4>${esc(it.cause)}${it.lastAgent ? ` · last agent ${esc(it.lastAgent)}` : ''}</h4>${it.msg ? `"${esc(it.msg)}"` : esc(it.gaveUp)}<br><span class="meta">${esc(it.gaveUp)}${it.fails ? `, ${plural(it.fails, 'failed attempt')}` : ''}. Two attempts, then a person.</span></div>`;
  } else if (stage === 'blocked') {
    const open = it.deps.filter((d) => !it.resolved.has(d) && !state.items.get(d)?.done).map((d) => state.items.get(d).ref);
    const first = it.deps.find((x) => !it.resolved.has(x) && !state.items.get(x)?.done);
    const behind = [...rootsOf(state, state.items.get(first))].map((k) => state.items.get(k).ref);
    body = `<div class="blk">Waits on <b>${esc(open.join(' and '))}</b>${behind.length ? `, which waits on <b>${esc(behind.join(' and '))}</b>` : ''}. <kbd>1</kbd> marks <b>${esc(open[0])}</b> resolved${open.length > 1 ? `; press again for ${esc(open.slice(1).join(' and '))}` : ''}.</div>`;
  } else if (stage === 'held') {
    body = `<div class="blk">Held by ${it.human ? '<span class="pill you">you</span>' : `<span class="agent">${esc(it.holder)}</span>`} for ${span(cut - it.claimedAt)}${it.steers ? `. ${plural(it.steers, 'note')} sent to the agent.` : ''}${it.human ? ' No agent will claim it.' : ''}</div>`;
  } else if (stage === 'review' || (stage === 'done' && it.pr)) {
    const h = it.pr.handoff;
    body = `<div class="blk">${kv([['PR', `<a href="#diff/${it.pr.n}" data-open>${it.pr.n}</a> by <span class="agent">${esc(it.pr.agent)}</span>`], ['size', esc(reviewSize(it))], ['state', stage === 'review' ? prBadge(it) : 'merged'], ['rounds', `${it.rounds + 1}${it.bot ? ' · bot approved (not counted as review)' : ''}`]])}</div>` +
      (h ? `<div class="blk"><h4>Agent's handoff</h4>${kv([['changed', esc(h.changed)], ['verified', esc(h.verified)], ['unsure', h.unsure ? `<span class="unsure">${esc(h.unsure)}</span>` : 'nothing flagged']])}` +
        `${it.pr.rated ? `<div class="rated">Marked ${esc(it.pr.rated)}</div>` : ''}</div>` : '');
  } else if (stage === 'done') body = `<div class="blk">Merged by ${esc(it.by)} as <a href="#pr/${it.prNum}" data-open>PR ${esc(it.prNum)}</a>.</div>`;
  body += storyBlock(it);
  const run = it.holder && it.run ? ` · <a href="#run/${esc(it.run)}" title="Opens the run at the claim">open run ${esc(it.run)}</a>` : '';
  let chainHtml = '';
  if (chain) {
    const chip = (k) => { const o = state.items.get(k); return `<button data-k="${esc(k)}" title="${esc(o.title)}">${esc(o.ref)}</button><span class="st">${esc(STAGE_NAME[o.stage] ?? o.stage)}${o.holder ? `, ${esc(o.holder)}` : ''}</span><span class="gap"></span>`; };
    const depth = (k) => { let d = 0; for (const x of state.items.get(k).deps) d = Math.max(d, 1 + depth(x)); return d; };
    const order = (set) => [...set].sort((a, b) => depth(a) - depth(b));
    if (chain.up.size) chainHtml += `<div class="chain">waits on ${order(chain.up).map(chip).join('')}</div>`;
    if (chain.down.size) chainHtml += `<div class="chain">blocks ${order(chain.down).map(chip).join('')}</div>`;
    if (!chain.up.size && !chain.down.size && view === 'board') chainHtml = `<div class="chain">No dependencies.</div>`;
  }
  const needsInput = (stage === 'needs' && !it.asked && it.gaveUp && it.cause !== 'redo limit') ? 'Note for the next attempt (optional)' : (stage === 'held' && !it.human) ? 'Note to the running agent' : null;
  const input = needsInput ? `<input type="text" id="note" placeholder="${needsInput}" aria-label="${needsInput}" autocomplete="off">` : '';
  const live = cut >= NOW, dis = live ? '' : ' disabled';
  const A = actionsFor(it), prim = primaryOf(A);
  const has = (id) => A.some((a) => a.id === id);
  const acts = A.filter((a) => !a.prop && !a.quiet && !a.card).map((a) => `<button class="${a === prim ? 'primary' : ''}" data-act="${a.id}"${dis} title="${esc(a.title ?? a.label)}">${a.n ? `<kbd>${a.n}</kbd>` : a.key ? `<kbd>${a.key}</kbd>` : ''}${esc(a.label)}${a === prim ? `<kbd class="mod">${MOD}↵</kbd>` : ''}</button>`).join('');
  const t = tierOf(it);
  const holder = it.human ? '<span class="pill you">you</span>' : it.holder ? `<span class="agent">${esc(it.holder)}</span>` : it.stage === 'review' ? `<span class="agent">${esc(it.pr.agent)}</span>` : stage === 'done' ? esc(it.by ?? '') : 'No one';
  const prop = (menu, key, on, inner) => (on ? `<button data-menu="${menu}"${dis}>${inner}<kbd>${key}</kbd></button>` : `<span>${inner}</span>`);
  const props = `<dl class="props"><dt>Status</dt><dd>${prop('status', 's', A.some((a) => a.to), `${stIcon(stage)}${esc(STAGE_NAME[stage] ?? stage)}`)}<span class="meta">for ${span(cut - it.since)}${it.snoozeUntil > cut ? ` · snoozed ${span(it.snoozeUntil - cut)}` : ''}${it.parked ? ' · parked' : ''}</span></dd>` +
    `<dt>Tier</dt><dd>${prop('tier', 'p', has('tier'), t != null ? `${pillHtml(it, t)}${pending.has(it.key) ? ' edited' : it.tier == null ? ' proposed' : ''}` : 'Not set')}</dd>` +
    `<dt>Assignee</dt><dd>${prop('assign', 'a', has('assign'), holder)}${run ? `<span class="meta">${run.slice(3)}</span>` : ''}</dd>` +
    `<dt>Source</dt><dd>${tagHtml(it)}<span>${esc(fx.sources[it.source].label)}</span><span class="meta">${esc(it.class)} · arrived ${span(cut - it.at)} ago</span></dd></dl>`;
  const err = lastError?.key === it.key ? `<div class="errline" role="alert"><b>Not recorded.</b> ${esc(lastError.text)}</div>` : '';
  return `<b class="t">${esc(it.title)}</b>${props}${body}${chainHtml}${input}${err}<div class="acts">${acts}${live ? '' : '<span class="meta">Go back to live to act.</span>'}</div>`;
}

function renderPanel(chain) {
  const p = $('panel');
  const it = selected && view !== 'metrics' && view !== 'replay' ? state.items.get(selected) : null;
  if (!it) {
    const hint = view === 'queue' && queue.rows.length > 0;
    p.className = hint ? 'open' : '';
    p.innerHTML = hint ? `<div class="hint"><b>Pick something from the queue.</b><br><kbd>j</kbd> <kbd>k</kbd> move. Each card shows its choices as numbers, and <kbd>${MOD}↵</kbd> takes the main one. <kbd>${MOD}K</kbd> finds everything else. What you do is listed below as the records it writes.</div>` : '';
    return;
  }
  const keep = p.dataset.k === it.key ? p.scrollTop : 0;
  p.className = 'open';
  p.dataset.k = it.key;
  p.innerHTML = `<div class="phead"><span class="ref mono">${tagHtml(it)}${esc(it.ref)}</span>` +
    `<button class="ic" data-copy title="Copy the link to this item" aria-label="Copy link">${ICON.link}</button>` +
    (hasHistory(it) ? `<button class="ic" data-story title="Open the story (Enter)" aria-label="Open the story">${ICON.expand}</button>` : '') +
    `<button class="ic" data-closep title="Close (Esc)" aria-label="Close">×</button></div><div class="detail">${detailHtml(it, view === 'queue' ? null : chain)}</div>`;
  p.scrollTop = keep;
}

// ---------- actions: each one appends a work.events record, and the view re-folds ----------

function nextAgent(it) {
  const a = fx.agents, i = a.indexOf(it.holder ?? it.lastAgent);
  const busyNow = new Set([...state.items.values()].filter((x) => x.holder).map((x) => x.holder));
  for (let n = 1; n <= a.length; n++) { const c = a[(i + n) % a.length]; if (c !== it.lastAgent && !busyNow.has(c)) return c; }
  return a[(i + 1) % a.length];
}
const noteText = () => ($('note')?.value ?? '').trim();

// What a person can do with an item. Numbered choices are the card's own verbs,
// shown on the card and pressed as 1 to 9. Tier, assign, snooze and status sit on
// the keys other trackers use for them. Everything is also on the palette.
function actionsFor(it) {
  const s = it.stage, A = [];
  let n = 0;
  const choice = (id, label, run, title, x = {}) => A.push({ id, label, run, title, n: x.n ?? ++n, ...x });
  const more = (id, key, label, run, title, x = {}) => A.push({ id, key, label, run, title, ...x });
  const tier = () => more('tier', 'p', 'Set tier', (t) => { if (s === 'triage') pending.set(it.key, t); else emit('tier_changed', it.key, { tier: t }); }, 'Set the tier', { menu: 'tier', prop: true });
  const assign = () => more('assign', 'a', 'Assign', (who) => (who === viewer ? emit('taken', it.key, { holder: viewer }) : emit('reassigned', it.key, { agent: who ?? nextAgent(it) })), 'Give it to an agent, or take it yourself', { menu: 'assign', prop: true });
  const snooze = () => more('snooze', 'h', 'Snooze', () => emit('snoozed', it.key, { until: NOW + 4 * HOUR }), 'Hide for 4 hours', { to: 'Snoozed for 4 hours' });
  const park = () => more('park', null, 'Park', () => emit('parked', it.key, {}), 'Take it off the queue without closing it', { to: 'Parked', quiet: true });
  const decline = (label, reason, x = {}) => choice('decline', label, () => emit('rejected', it.key, { reason }), 'Close it', { to: 'Closed', ...x });
  if (s === 'triage') {
    if (it.proposal) {
      choice('accept', 'Accept', () => {
        const p = it.proposal, tier = tierOf(it);
        emit('triaged', it.key, { tier, ...(pending.has(it.key) ? { edited: true } : {}) });
        for (const d of p.on) if (state.items.has(d)) emit('linked', it.key, { on: d });
        pending.delete(it.key);
      }, 'Accept the proposed tier and dependencies', { n: 1, to: 'Ready' });
      if (it.proposal.dup && state.items.has(it.proposal.dup)) choice('duplicate', 'Merge duplicate', () => emit('rejected', it.key, { reason: 'duplicate', dup: it.proposal.dup }), 'Close this and keep the original', { n: 2 });
    }
    decline('Decline', 'declined at triage', { n: 3 });
    if (it.proposal) tier();
    snooze();
  } else if (s === 'needs' && it.cause === 'redo limit') {
    choice('take', 'Take it yourself', () => emit('taken', it.key, { holder: viewer }), 'Mark it yours so no agent claims it', { to: 'Held by you' });
    choice('split', 'Split it', () => emit('split', it.key, {}), 'Close this and split it into smaller items');
    decline('Close', 'closed from needs you');
    snooze();
  } else if (s === 'needs' && it.asked) {
    (it.options ?? []).forEach((o, i) => choice(`opt${i + 1}`, o, () => emit('answered', it.key, { chosen: o }), `Answer "${o}"`, { card: true, done: 'Answered' }));
    choice('other', 'Other', () => $('note')?.focus(), 'Type a different answer', { card: true });
    more('answer', null, it.def ? `Answer "${it.def}"` : 'Answer', () => {
      const t = noteText();
      if (t) emit('answered', it.key, { text: t }); else if (it.def) emit('answered', it.key, { chosen: it.def }); else $('note')?.focus();
    }, 'Send what you typed, or the default', { primary: true, card: true });
    more('decline', null, 'Close', () => emit('rejected', it.key, { reason: 'closed from needs you' }), 'Close it', { to: 'Closed' });
    tier(); snooze();
  } else if (s === 'needs') {
    choice('retry', 'Retry', () => { const t = noteText(); emit('retried', it.key, t ? { note: t } : {}); }, 'Requeue, with the note if you wrote one', { to: 'Ready' });
    decline('Close', 'closed from needs you');
    assign(); tier(); snooze(); park();
  } else if (s === 'blocked') {
    const d = it.deps.find((x) => !it.resolved.has(x) && !state.items.get(x)?.done);
    if (d) choice('unblock', `Unblock ${state.items.get(d).ref}`, () => emit('unblocked', it.key, { on: d }), `Mark ${state.items.get(d).ref} resolved for this item`, { to: 'Ready' });
    tier(); snooze();
  } else if (s === 'ready') {
    assign(); tier(); snooze();
  } else if (s === 'held') {
    if (!it.human) {
      choice('steer', 'Steer', () => { const t = noteText(); if (!t) { $('note')?.focus(); return; } emit('steered', it.key, { note: t }); }, 'Send a note to the running agent');
      choice('stop', 'Stop', () => emit('released', it.key, { agent: it.holder }), 'Stop the agent and requeue the item', { to: 'Ready' });
    } else choice('release', 'Release', () => emit('released', it.key, { agent: it.holder }), 'Give it back to the queue', { to: 'Ready' });
    assign();
  } else if (s === 'review') {
    const w = waitingOf(it);
    if (w === 'unassigned') choice('request_review', 'Request review', (who) => emit('review_requested', it.key, { reviewer: who }), 'Ask a person to review it', { menu: 'reviewer' });
    if (w === 'reviewer' || w === 'unassigned') {
      choice('approve', 'Approve', () => emit('approved', it.key, {}));
      choice('changes', 'Request changes', () => {
        if (hasHistory(it)) { openReplay(it.key); const d = decisionsOf(pathOf(it, replay.n)).at(-1); replay.idx = curPath().length - 1; openRedo(d, 'Request changes'); } else emit('changes_requested', it.key, {});
      }, 'Send the PR back from its last decision; your comment becomes the note');
    }
    if (w === 'merge') choice('merged', 'Mark merged', () => emit('done', it.key, { agent: it.pr.agent, pr: it.pr.n }), 'Record the merge you did upstream; the tracker never merges', { to: 'Done' });
    choice('decline', 'Reject', () => {
      if (it.paths?.length && (it.redos ?? 0) >= redoLimit()) { emit('attempt_rejected', it.key, { attempt: it.paths.at(-1).n, reason: 'wrong approach' }); emit('redo_limit', it.key, { by: undefined }); } else emit('rejected', it.key, { reason: 'wrong approach' });
    }, 'Close the PR as the wrong approach', { to: 'Closed' });

const DONE_TEXT = { accept: 'Accepted', duplicate: 'Merged as a duplicate:', decline: 'Closed', take: 'Taken:', split: 'Split', answer: 'Answered', retry: 'Queued again:', unblock: 'Unblocked', steer: 'Note sent on', stop: 'Stopped', release: 'Released', request_review: 'Review requested on', approve: 'Approved', changes: 'Changes requested on', merged: 'Marked merged:', rate_up: 'Summary rated on', rate_down: 'Summary rated on', tier: 'Tier set on', assign: 'Assigned', snooze: 'Snoozed for 4 hours:', park: 'Parked' };

// What an action applies to: the ticked rows, or else the open item.
