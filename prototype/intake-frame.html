<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Felix Agents intake frame</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080d13;
    --panel: #0d141c;
    --card: #121c26;
    --card-hover: #17242f;
    --line: rgba(160, 200, 220, 0.11);
    --line-strong: rgba(160, 200, 220, 0.22);
    --text: #e6eef4;
    --muted: #8496a5;
    --faint: #4a5a68;
    --cyan: hsl(192, 90%, 46%);
    --cyan-soft: hsla(192, 90%, 46%, 0.16);
    --result: hsl(190, 85%, 74%);
    --amber: #ffb547;
    --amber-soft: hsla(38, 100%, 64%, 0.14);
    --on-cyan: #04141a;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #f3f6f9;
    --panel: #ffffff;
    --card: #ffffff;
    --card-hover: #f1f7fa;
    --line: rgba(20, 50, 70, 0.10);
    --line-strong: rgba(20, 50, 70, 0.2);
    --text: #0e1a24;
    --muted: #566877;
    --faint: #a7b4be;
    --cyan: hsl(192, 90%, 40%);
    --cyan-soft: hsla(192, 90%, 40%, 0.12);
    --result: hsl(192, 75%, 56%);
    --amber: #b36f00;
    --amber-soft: hsla(38, 100%, 45%, 0.14);
    --on-cyan: #ffffff;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 500 13px/1.4 Inter, system-ui, sans-serif; }
  body { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
  button { font: inherit; color: inherit; background: transparent; border: 1px solid var(--line-strong); border-radius: 8px; height: 30px; padding: 0 10px; cursor: pointer; }
  button:hover { border-color: var(--cyan); }
  button:focus-visible, .row:focus-visible, input:focus-visible { outline: 2px solid var(--cyan); outline-offset: 1px; }

  header { flex: none; height: 56px; display: flex; align-items: center; gap: 14px; padding: 0 18px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; white-space: nowrap; }
  .brand img { width: 36px; height: 36px; object-fit: contain; }
  .sep { width: 1px; height: 26px; background: var(--line-strong); }
  .view { min-width: 0; display: flex; flex-direction: column; }
  .view b { font-weight: 600; font-size: 14px; white-space: nowrap; }
  .view span { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stats { margin-left: auto; display: flex; gap: 22px; align-items: center; }
  .stat { display: flex; flex-direction: column; align-items: flex-end; }
  .stat small { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; white-space: nowrap; }
  .stat b { font: 600 15px "JetBrains Mono", monospace; }
  .stat b i { font-style: normal; color: var(--muted); font-weight: 500; }
  #theme { width: 34px; padding: 0; font-size: 15px; }

  nav { display: none; }
  main { flex: 1; min-height: 0; overflow: auto; padding: 14px 18px 18px; }
  .board { position: relative; display: grid; grid-template-columns: 170px repeat(6, minmax(168px, 1fr)); gap: 10px; align-items: start; min-width: min-content; }
  #links { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; z-index: 3; }
  #links path { fill: none; stroke: var(--cyan); stroke-width: 1.75; opacity: 0.9; }
  #links path.far { stroke-dasharray: 3 4; opacity: 0.7; }
  #links circle { fill: var(--cyan); }

  .col { min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: clip; }
  .col.you { border-color: color-mix(in srgb, var(--cyan) 45%, var(--line)); box-shadow: 0 0 0 1px color-mix(in srgb, var(--cyan) 18%, transparent); }
  .col > h2 { margin: 0; padding: 10px 12px 9px; display: flex; align-items: baseline; gap: 8px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); z-index: 2; }
  .col.you > h2 { color: var(--cyan); }
  .col > h2 .n { margin-left: auto; font: 600 20px/1 "JetBrains Mono", monospace; color: var(--text); letter-spacing: 0; }
  .oldest { display: flex; justify-content: space-between; padding: 6px 12px; font-size: 11.5px; color: var(--muted); border-bottom: 1px solid var(--line); }
  .oldest b { font: 600 11.5px "JetBrains Mono", monospace; color: var(--text); }
  .oldest.stale b { color: var(--amber); }
  .body { padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  .empty { color: var(--faint); padding: 14px 6px; text-align: center; font-size: 12px; }
  .tierhead { display: flex; align-items: baseline; gap: 8px; padding: 6px 4px 0; font-size: 11px; color: var(--muted); }
  .tierhead:first-child { padding-top: 0; }
  .tierhead .mono { color: var(--text); font-weight: 600; }
  .tierhead .tc { margin-left: auto; font: 500 11px "JetBrains Mono", monospace; }
  .tierhead.stale .tc { color: var(--amber); }

  .row { position: relative; display: block; width: 100%; height: auto; text-align: left; padding: 7px 9px 8px; background: var(--card); border: 1px solid var(--line); border-radius: 9px; }
  .row:hover { background: var(--card-hover); border-color: var(--line-strong); }
  .row .l1 { display: flex; align-items: center; gap: 5px; }
  .tag { white-space: nowrap; font: 600 9px/1 "JetBrains Mono", monospace; padding: 3px 4px; border-radius: 4px; border: 1px solid var(--line-strong); color: var(--muted); letter-spacing: 0.03em; }
  .ref { white-space: nowrap; font: 600 11.5px "JetBrains Mono", monospace; }
  .age { margin-left: auto; padding-left: 4px; font: 500 11px "JetBrains Mono", monospace; color: var(--muted); }
  .age.stale { color: var(--amber); }
  .title { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; margin-top: 4px; color: var(--text); font-size: 12.5px; line-height: 1.3; overflow: hidden; }
  .l3 { display: flex; align-items: center; gap: 6px; margin-top: 5px; min-width: 0; }
  .l3 .note { margin-top: 0; min-width: 0; flex: 1; }
  .note { display: block; margin-top: 3px; font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .note b { font: 600 11px "JetBrains Mono", monospace; color: var(--text); }
  .row.ask { border-left: 3px solid var(--cyan); }
  .row.fail { border-left: 3px solid var(--amber); }
  .row.fail .note, .note.warn { color: var(--amber); }
  .pill { font: 600 10px/1 "JetBrains Mono", monospace; padding: 3px 5px; border-radius: 999px; }
  .pill.p0 { background: var(--cyan); color: var(--on-cyan); }
  .pill.p1 { border: 1px solid var(--cyan); color: var(--cyan); }
  .pill.p2 { border: 1px solid var(--line-strong); color: var(--muted); }
  .pill.p3 { border: 1px dashed var(--line-strong); color: var(--faint); }
  .agent { color: var(--cyan); background: var(--cyan-soft); border-radius: 5px; padding: 1px 6px; font: 600 11px "JetBrains Mono", monospace; }
  .more { height: 28px; font-size: 12px; color: var(--muted); border-style: dashed; }

  /* Selecting an item dims what is not in its chain. */
  .picked .row { opacity: 0.34; }
  .picked .row.chain, .picked .row.sel { opacity: 1; }
  .row.chain { border-color: color-mix(in srgb, var(--cyan) 60%, var(--line)); }
  .row.sel { border-color: var(--cyan); background: var(--cyan-soft); box-shadow: 0 0 0 1px var(--cyan); }

  .src { background: var(--card); border: 1px solid var(--line); border-radius: 9px; padding: 8px 9px 9px; }
  .src .top { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 12.5px; }
  .src .top .open { margin-left: auto; font: 500 11px "JetBrains Mono", monospace; color: var(--muted); }
  .src .rates { display: flex; gap: 12px; margin-top: 6px; font: 600 12px "JetBrains Mono", monospace; }
  .src .rates small { display: block; font: 500 10px Inter, sans-serif; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .src svg { display: block; width: 100%; height: 22px; margin-top: 6px; }
  .src svg rect { fill: var(--cyan); opacity: 0.75; }
  .src svg line { stroke: var(--line-strong); }

  #dock { flex: none; border-top: 1px solid var(--line); background: var(--panel); padding: 10px 18px; display: none; }
  #dock.open { display: block; }
  #dock .head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  #dock .head b.t { font-weight: 600; font-size: 14px; min-width: 0; }
  #dock .head .x { margin-left: auto; width: 26px; height: 26px; padding: 0; }
  #dock .meta { color: var(--muted); font-size: 12px; margin-top: 3px; }
  #dock .chain { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px 6px; align-items: center; font-size: 12px; color: var(--muted); }
  #dock .chain button { height: 24px; padding: 0 8px; font: 600 11.5px "JetBrains Mono", monospace; }
  #dock .chain button.me { border-color: var(--cyan); color: var(--cyan); }
  #dock .chain .gap { width: 8px; }
  #dock .chain .st { font: 500 11px Inter, sans-serif; color: var(--muted); }
  #dock a { color: var(--cyan); text-decoration: none; font-weight: 600; }
  #dock a:hover { text-decoration: underline; }

  footer { flex: none; border-top: 1px solid var(--line); background: var(--panel); padding: 10px 18px 12px; display: flex; flex-direction: column; gap: 8px; }
  .rates { display: flex; align-items: baseline; gap: 20px; flex-wrap: wrap; }
  .rates .m { font: 600 13px "JetBrains Mono", monospace; }
  .rates .m small { font: 500 11px Inter, sans-serif; color: var(--muted); margin-right: 5px; }
  .verdict { color: var(--muted); font-size: 12.5px; }
  .verdict b { color: var(--text); font-weight: 600; }
  .verdict.grow b { color: var(--amber); }
  .scrub { display: flex; align-items: center; gap: 10px; }
  .scrub input { flex: 1; min-width: 0; accent-color: var(--cyan); }
  .scrub .at { font: 500 12px "JetBrains Mono", monospace; color: var(--muted); min-width: 84px; text-align: right; }
  #live { font: 600 12px Inter, sans-serif; }
  #live.on { background: var(--cyan); border-color: var(--cyan); color: var(--on-cyan); }

  @media (max-width: 760px) {
    header { height: 52px; padding: 0 12px; gap: 10px; }
    .brand span, .sep, .view span, .stat.hide-sm { display: none; }
    .brand img { width: 30px; height: 30px; }
    .stats { gap: 14px; }
    nav { display: flex; flex: none; gap: 6px; overflow-x: auto; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); scrollbar-width: none; }
    nav::-webkit-scrollbar { display: none; }
    nav a { flex: none; display: flex; align-items: baseline; gap: 6px; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line-strong); color: var(--muted); font-size: 12px; font-weight: 600; text-decoration: none; }
    nav a b { font: 600 13px "JetBrains Mono", monospace; color: var(--text); }
    nav a.you { border-color: var(--cyan); }
    nav a.you b { color: var(--cyan); }
    main { padding: 10px 12px 14px; }
    .board { display: flex; flex-direction: column; align-items: stretch; gap: 10px; min-width: 0; }
    #links { display: none; }
    .col > h2 { position: static; }
    .col.srcs .body { flex-direction: row; overflow-x: auto; }
    .col.srcs .src { flex: 0 0 200px; }
    #dock { padding: 10px 12px; max-height: 42dvh; overflow: auto; }
    footer { padding: 8px 12px 10px; gap: 6px; }
    .rates { gap: 4px 14px; }
    .scrub .at { min-width: 60px; }
  }
</style>
</head>
<body>
<header>
  <div class="brand"><img src="../docs/brand/felix-agents-mark.png" alt=""><span>Felix Agents</span></div>
  <div class="sep"></div>
  <div class="view"><b>Intake</b><span id="scope"></span></div>
  <div class="stats">
    <div class="stat"><small>Open</small><b id="sOpen">0</b></div>
    <div class="stat"><small>Agents busy</small><b id="sAgents">0</b></div>
    <button id="theme" title="Toggle theme" aria-label="Toggle theme">◐</button>
  </div>
</header>
<nav id="nav" aria-label="Stages"></nav>
<main id="main"><div class="board" id="board"><svg id="links" aria-hidden="true"></svg></div></main>
<section id="dock" aria-label="Selected item"></section>
<footer>
  <div class="rates" id="rates"></div>
  <div class="scrub">
    <input id="scrub" type="range" aria-label="Show the queue as it was">
    <span class="at" id="at"></span>
    <button id="live" aria-label="Back to live">live</button>
  </div>
</footer>
<script type="module">
const HOUR = 3600, DAY = 86400;
// Per stage, how old the oldest item may get before its age turns amber.
const STALE = { arrived: 12 * HOUR, needs: DAY, blocked: 4 * DAY, ready: 2 * DAY, held: DAY };
const STAGES = [
  ['arrived', 'Arrived'], ['needs', 'Needs you'], ['blocked', 'Blocked'],
  ['ready', 'Ready'], ['held', 'Held'], ['done', 'Done'],
];
const CAP = 8;       // rows a stage shows before "show more"
const TIER_CAP = 5;  // rows a ready tier shows before "show more"
const DONE_SHOWN = HOUR * 24;

const params = new URLSearchParams(location.search);
const root = document.documentElement;
root.dataset.theme = params.get('theme') || localGet('fa-theme') || 'dark';
const fx = await (await fetch(params.get('fixture') || 'fixture-work.json')).json();
await Promise.all([
  document.fonts.load('600 13px Inter'), document.fonts.load('500 12px Inter'), document.fonts.load('700 13px Inter'),
  document.fonts.load('500 11px "JetBrains Mono"'), document.fonts.load('600 12px "JetBrains Mono"'),
]).catch(() => {});

function localGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function localSet(k, v) { try { localStorage.setItem(k, v); } catch {} }
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const $ = (id) => document.getElementById(id);

function span(s) {
  s = Math.max(0, s);
  if (s < 60) return '<1m';
  if (s < 120 * 60) return `${Math.floor(s / 60)}m`;
  if (s < 48 * HOUR) return `${Math.floor(s / HOUR)}h`;
  return `${Math.floor(s / DAY)}d`;
}

// ---------- the fold: work.events up to a cut -> every item's stage ----------

const recs = fx.records;
const NOW = fx.now;
const FIRST = recs[0].t;

function fold(cut) {
  const items = new Map();
  const dependents = new Map();
  const stageOf = (it) => {
    if (it.done) return 'done';
    if (it.asked || it.gaveUp) return 'needs';
    if (it.holder) return 'held';
    if (it.tier == null) return 'arrived';
    for (const d of it.deps) if (!items.get(d)?.done) return 'blocked';
    return 'ready';
  };
  const settle = (it, t) => {
    const s = stageOf(it);
    if (s !== it.stage) { it.stage = s; it.since = t; }
  };
  for (const r of recs) {
    if (r.t > cut) break;
    if (r.kind === 'imported') {
      const meta = fx.items[r.item];
      items.set(r.item, { key: r.item, ...meta, at: r.t, tier: null, deps: [], stage: null, since: r.t, attempts: 0 });
    }
    const it = items.get(r.item);
    if (!it) continue;
    if (r.kind === 'triaged') it.tier = r.tier;
    else if (r.kind === 'linked') { it.deps.push(r.on); (dependents.get(r.on) ?? dependents.set(r.on, []).get(r.on)).push(r.item); }
    else if (r.kind === 'asked') it.asked = r.text;
    else if (r.kind === 'answered') it.asked = null;
    else if (r.kind === 'claimed') { it.holder = r.agent; it.run = r.run; it.claimedAt = r.t; it.gaveUp = null; }
    else if (r.kind === 'failed') { it.holder = null; it.attempts = r.attempts; }
    else if (r.kind === 'gave_up') { it.holder = null; it.gaveUp = r.reason; }
    else if (r.kind === 'released') it.holder = null;
    else if (r.kind === 'done') { it.done = true; it.doneAt = r.t; it.holder = null; it.by = r.agent; it.pr = r.pr; }
    settle(it, r.t);
    if (r.kind === 'done') for (const k of dependents.get(r.item) ?? []) settle(items.get(k), r.t);
  }
  return { items, dependents, cut };
}

// Everything an item waits on, and everything that waits on it.
function chainOf(state, key) {
  const up = new Set(), down = new Set();
  const walkUp = (k) => { for (const d of state.items.get(k)?.deps ?? []) if (state.items.has(d) && !up.has(d)) { up.add(d); walkUp(d); } };
  const walkDown = (k) => { for (const d of state.dependents.get(k) ?? []) if (!down.has(d)) { down.add(d); walkDown(d); } };
  walkUp(key); walkDown(key);
  return { up, down, all: new Set([key, ...up, ...down]) };
}

// ---------- view state ----------

let cut = NOW;
let selected = params.get('select');
const expanded = new Set();   // stage or stage:tier keys opened with "show more"
let state, lastInfo;

function summarize(st) {
  const by = Object.fromEntries(STAGES.map(([k]) => [k, []]));
  for (const it of st.items.values()) by[it.stage].push(it);
  for (const k of Object.keys(by)) {
    by[k].sort(k === 'done' ? (a, b) => b.since - a.since : (a, b) => a.since - b.since || a.key.localeCompare(b.key));
  }
  by.done = by.done.filter((it) => st.cut - it.since <= DONE_SHOWN);
  return by;
}

function render() {
  state = fold(cut);
  const by = summarize(state);
  if (selected && !state.items.has(selected)) selected = null;
  const chain = selected ? chainOf(state, selected) : null;
  const forced = chain ? chain.all : new Set();
  const tag = (it) => `<span class="tag">${esc(fx.sources[it.source].tag)}</span>`;
  const age = (it, stage) => `<span class="age${stage && st(it, stage) ? ' stale' : ''}">${span(cut - it.since)}</span>`;
  const st = (it, stage) => cut - it.since > STALE[stage];

  const row = (it, stage) => {
    let cls = 'row', note = '';
    if (it.key === selected) cls += ' sel'; else if (chain?.all.has(it.key)) cls += ' chain';
    if (stage === 'needs') {
      if (it.gaveUp) { cls += ' fail'; note = `<span class="note">${it.attempts ? `failed ${it.attempts}x, ` : ''}${esc(it.gaveUp)}${it.holder ? '' : ''}</span>`; }
      else { cls += ' ask'; note = `<span class="note">asks: ${esc(it.asked)}</span>`; }
    } else if (stage === 'blocked') {
      const open = it.deps.filter((d) => !state.items.get(d)?.done).map((d) => state.items.get(d).ref);
      note = `<span class="note">waits on <b>${esc(open.join(', '))}</b></span>`;
    } else if (stage === 'held') {
      note = `<span class="note"><span class="agent">${esc(it.holder)}</span> since ${span(cut - it.claimedAt)}</span>`;
    } else if (stage === 'done') {
      note = `<span class="note">${esc(it.by)} <b>PR ${esc(it.pr)}</b></span>`;
    }
    const pill = stage === 'ready' || it.tier == null ? '' : `<span class="pill p${it.tier}">P${it.tier}</span>`;
    return `<button class="${cls}" data-k="${esc(it.key)}" aria-pressed="${it.key === selected}" title="${esc(it.title)}">` +
      `<span class="l1">${tag(it)}<span class="ref">${esc(it.ref)}</span>${age(it, stage === 'done' ? null : stage)}</span>` +
      `<span class="title">${esc(it.title)}</span>${note ? `<span class="l3">${pill}${note}</span>` : ''}</button>`;
  };

  const list = (arr, stage, key, cap) => {
    const shown = [];
    let hidden = 0;
    for (const it of arr) (shown.length < cap || forced.has(it.key) || expanded.has(key)) ? shown.push(it) : hidden++;
    return shown.map((it) => row(it, stage)).join('') +
      (hidden ? `<button class="more" data-more="${key}">${hidden} more</button>` : '') +
      (expanded.has(key) && arr.length > cap ? `<button class="more" data-less="${key}">show fewer</button>` : '');
  };

  const cols = [];
  // Sources: arrivals in the last hour and day, and 24 hourly bars.
  const srcRows = Object.entries(fx.sources).map(([id, s]) => {
    const mine = [...state.items.values()].filter((it) => it.source === id);
    const h1 = mine.filter((it) => cut - it.at <= HOUR).length;
    const d1 = mine.filter((it) => cut - it.at <= DAY).length;
    const open = mine.filter((it) => !it.done).length;
    const bins = Array(24).fill(0);
    for (const it of mine) { const b = Math.floor((cut - it.at) / HOUR); if (b >= 0 && b < 24) bins[23 - b]++; }
    const peak = Math.max(1, ...bins);
    const bars = bins.map((n, i) => n ? `<rect x="${i * 10 + 1}" width="8" y="${22 - Math.max(2, n / peak * 22)}" height="${Math.max(2, n / peak * 22)}" rx="1.5"></rect>` : '').join('');
    return `<div class="src"><div class="top"><span class="tag">${esc(s.tag)}</span>${esc(s.label)}</div>` +
      `<div class="rates"><span><small>1h</small>+${h1}</span><span><small>24h</small>+${d1}</span><span><small>open</small>${open}</span></div>` +
      `<svg viewBox="0 0 240 22" preserveAspectRatio="none" role="img" aria-label="Arrivals per hour, last 24 hours"><line x1="0" x2="240" y1="21.5" y2="21.5"></line>${bars}</svg></div>`;
  }).join('');
  cols.push(`<section class="col srcs" id="c-sources"><h2>Sources</h2><div class="body">${srcRows}</div></section>`);

  const oldestOf = (arr) => arr.length ? arr.reduce((a, b) => (a.since <= b.since ? a : b)) : null;
  const colInfo = {};
  for (const [stage, name] of STAGES) {
    const arr = by[stage];
    const old = stage === 'done' ? null : oldestOf(arr);
    colInfo[stage] = { count: arr.length, oldest: old ? cut - old.since : 0, oldestRef: old?.ref ?? null };
    const stale = old && cut - old.since > STALE[stage];
    const oldLine = stage === 'done'
      ? `<div class="oldest"><span>last 24 hours</span><b>${arr.length}</b></div>`
      : `<div class="oldest${stale ? ' stale' : ''}"><span>oldest${old ? ` ${esc(old.ref)}` : ''}</span><b>${old ? span(cut - old.since) : 'none'}</b></div>`;
    let body;
    if (!arr.length) body = `<div class="empty">Nothing here</div>`;
    else if (stage === 'ready') {
      body = [0, 1, 2, 3].map((t) => {
        const tier = arr.filter((it) => it.tier === t);
        if (!tier.length) return '';
        const o = oldestOf(tier);
        return `<div class="tierhead${cut - o.since > STALE.ready ? ' stale' : ''}"><span class="pill p${t}">P${t}</span><span>${tier.length}</span><span class="tc">oldest ${span(cut - o.since)}</span></div>` +
          list(tier, 'ready', `ready:${t}`, TIER_CAP);
      }).join('');
    } else body = list(arr, stage, stage, CAP);
    cols.push(`<section class="col${stage === 'needs' ? ' you' : ''}" id="c-${stage}" data-stage="${stage}"><h2>${name}<span class="n">${arr.length}</span></h2>${oldLine}<div class="body">${body}</div></section>`);
  }
  const board = $('board');
  board.className = 'board' + (chain ? ' picked' : '');
  board.innerHTML = `<svg id="links" aria-hidden="true"></svg>` + cols.join('');

  // Phone navigation.
  $('nav').innerHTML = [['sources', 'Sources', ''], ...STAGES.map(([k, n]) => [k, n, colInfo[k].count])]
    .map(([k, n, c]) => `<a href="#c-${k}" data-nav="${k}"${k === 'needs' ? ' class="you"' : ''}>${n}${c === '' ? '' : ` <b>${c}</b>`}</a>`).join('');

  // Header and footer.
  const open = [...state.items.values()].filter((it) => !it.done).length;
  const busy = by.held.length, agents = fx.agents.length;
  $('scope').textContent = fx.scope;
  $('sOpen').textContent = open;
  $('sAgents').innerHTML = `${busy}<i>/${agents}</i>`;

  const inDay = [...state.items.values()].filter((it) => cut - it.at <= DAY).length;
  const outDay = [...state.items.values()].filter((it) => it.done && cut - it.doneAt <= DAY).length;
  const net = inDay - outDay;
  const oldReady = oldestOf(by.ready);
  let verdict;
  if (net <= 0) verdict = `<span class="verdict"><b>Draining.</b> Finishing at least as fast as work arrives.</span>`;
  else if (by.needs.length > by.ready.length) verdict = `<span class="verdict grow"><b>Growing by ${net} a day.</b> ${by.needs.length} items wait on a person, so more agents would not help.</span>`;
  else if (busy < agents) verdict = `<span class="verdict grow"><b>Growing by ${net} a day.</b> ${agents - busy} of ${agents} agents are idle while work is ready: check the claim path.</span>`;
  else verdict = `<span class="verdict grow"><b>Growing by ${net} a day.</b> Every agent is busy: it needs more agents or fewer bugs.</span>`;
  $('rates').innerHTML =
    `<span class="m"><small>in</small>${inDay}/day</span><span class="m"><small>out</small>${outDay}/day</span>` +
    `<span class="m"><small>oldest ready</small>${oldReady ? `${span(cut - oldReady.since)} (${esc(oldReady.ref)})` : 'none'}</span>${verdict}`;
  const live = cut >= NOW;
  $('at').textContent = live ? 'live' : `${span(NOW - cut)} ago`;
  $('live').classList.toggle('on', live);
  $('scrub').value = cut;

  renderDock(chain);
  requestAnimationFrame(() => drawLinks(chain));
  lastInfo = { colInfo, open, busy, inDay, outDay };
  root.dataset.ready = '1';
}

function renderDock(chain) {
  const dock = $('dock');
  if (!selected) { dock.className = ''; dock.innerHTML = ''; return; }
  const it = state.items.get(selected);
  const stageName = Object.fromEntries(STAGES)[it.stage];
  const chip = (k) => {
    const o = state.items.get(k);
    return `<button data-k="${esc(k)}" title="${esc(o.title)}">${esc(o.ref)}</button><span class="st">${esc(Object.fromEntries(STAGES)[o.stage])}${o.holder ? `, ${esc(o.holder)}` : ''}</span><span class="gap"></span>`;
  };
  const order = (set) => [...set].sort((a, b) => chainDepth(a) - chainDepth(b));
  const chainDepth = (k) => { let d = 0; for (const x of state.items.get(k).deps) d = Math.max(d, 1 + chainDepth(x)); return d; };
  let chainHtml = '';
  if (chain.up.size) chainHtml += `<div class="chain">waits on ${order(chain.up).map(chip).join('')}</div>`;
  if (chain.down.size) chainHtml += `<div class="chain">blocks ${order(chain.down).map(chip).join('')}</div>`;
  if (!chain.up.size && !chain.down.size) chainHtml = `<div class="chain">No dependencies.</div>`;
  const run = it.holder ? ` · <a href="#run/${esc(it.run)}" title="Opens the run in the swarm view at the claim">open run ${esc(it.run)}</a>` : '';
  dock.className = 'open';
  dock.innerHTML = `<div class="head"><span class="tag">${esc(fx.sources[it.source].tag)}</span><span class="ref mono">${esc(it.ref)}</span>` +
    `${it.tier == null ? '' : `<span class="pill p${it.tier}">P${it.tier}</span>`}<b class="t">${esc(it.title)}</b><button class="x" id="close" aria-label="Clear selection">×</button></div>` +
    `<div class="meta">${esc(stageName)} for ${span(cut - it.since)} · arrived ${span(cut - it.at)} ago${it.holder ? ` · held by <span class="agent">${esc(it.holder)}</span>` : ''}${run}</div>${chainHtml}`;
}

// Curves from each dependency to the item that waits on it, between rows in view.
function drawLinks(chain) {
  const svg = $('links');
  svg.innerHTML = '';
  if (!chain || getComputedStyle(svg).display === 'none') return;
  const b = $('board').getBoundingClientRect();
  const pos = (k) => {
    const el = $('board').querySelector(`.row[data-k="${CSS.escape(k)}"]`);
    if (!el) return null;
    const r = el.getBoundingClientRect();
    return { l: r.left - b.left, r: r.right - b.left, y: r.top - b.top + r.height / 2 };
  };
  let out = '';
  for (const k of chain.all) {
    const to = pos(k);
    for (const d of state.items.get(k).deps) {
      if (!chain.all.has(d)) continue;
      const from = pos(d);
      if (!from || !to) continue;
      let p, a, z;
      if (Math.abs(from.l - to.l) < 4) {
        // Same column: bow out to the right edge.
        a = [from.r, from.y]; z = [to.r, to.y];
        const x = from.r + 14;
        p = `M${a[0]},${a[1]} C${x},${a[1]} ${x},${z[1]} ${z[0]},${z[1]}`;
      } else if (from.l > to.l) {
        a = [from.l, from.y]; z = [to.r, to.y];
        const m = (a[0] + z[0]) / 2;
        p = `M${a[0]},${a[1]} C${m},${a[1]} ${m},${z[1]} ${z[0]},${z[1]}`;
      } else {
        a = [from.r, from.y]; z = [to.l, to.y];
        const m = (a[0] + z[0]) / 2;
        p = `M${a[0]},${a[1]} C${m},${a[1]} ${m},${z[1]} ${z[0]},${z[1]}`;
      }
      out += `<path d="${p}"></path><circle cx="${a[0]}" cy="${a[1]}" r="3"></circle><circle cx="${z[0]}" cy="${z[1]}" r="3"></circle>`;
    }
  }
  svg.innerHTML = out;
}

// ---------- input ----------

$('board').addEventListener('click', (e) => {
  const more = e.target.closest('[data-more]');
  if (more) { expanded.add(more.dataset.more); render(); return; }
  const less = e.target.closest('[data-less]');
  if (less) { expanded.delete(less.dataset.less); render(); return; }
  const row = e.target.closest('.row');
  selected = row && row.dataset.k !== selected ? row.dataset.k : null;
  render();
});
$('dock').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  selected = b.id === 'close' ? null : b.dataset.k;
  render();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && selected) { selected = null; render(); } });
$('nav').addEventListener('click', (e) => {
  const a = e.target.closest('a');
  if (!a) return;
  e.preventDefault();
  $('c-' + a.dataset.nav).scrollIntoView({ block: 'start' });
});
$('scrub').min = FIRST; $('scrub').max = NOW; $('scrub').step = 60;
$('scrub').oninput = (e) => { cut = +e.target.value; render(); };
$('live').onclick = () => { cut = NOW; render(); };
$('theme').onclick = () => {
  root.dataset.theme = root.dataset.theme === 'light' ? 'dark' : 'light';
  localSet('fa-theme', root.dataset.theme);
};
addEventListener('resize', () => { if (selected) drawLinks(chainOf(state, selected)); });
if (params.has('ago')) cut = Math.max(FIRST, NOW - +params.get('ago'));

window.select = (k) => { selected = k; render(); };
window.scrubTo = (c) => { cut = c; render(); };
window.intakeInfo = () => ({
  kinds: [...new Set(recs.map((r) => r.kind))],
  sources: Object.keys(fx.sources).filter((s) => Object.values(fx.items).some((i) => i.source === s)),
  agents: [...new Set(recs.filter((r) => r.agent).map((r) => r.agent))],
  tiers: [...new Set(recs.filter((r) => r.kind === 'triaged').map((r) => r.tier))],
  items: Object.keys(fx.items).length,
  ...lastInfo,
  links: $('links').querySelectorAll('path').length,
  chain: selected ? [...chainOf(state, selected).all] : [],
});
render();
</script>
</body>
</html>
