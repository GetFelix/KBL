// Runs one action, by id, number or key, on every target that has it. The view
// changes at once. The toast offers undo, which takes the records back out.
function act(x, arg) {
  const its = targets();
  if (!its.length) return false;
  if (cut < NOW) { toast({ text: `You are looking at the queue as it was ${span(NOW - cut)} ago. Go back to live to act.`, err: true, action: { label: 'Back to live', run: () => { cut = NOW; render(); } } }); return false; }
  const first = its.map((it) => findAction(it, x)).find(Boolean);
  if (!first) return false;
  if (first.menu && arg === undefined) { openPal(first.menu); return true; }
  const queueKeys = view === 'queue' ? queue.rows.map((r) => r.it.key) : [];
  const idx = queueKeys.indexOf(selected);
  const m = markNow();
  const hit = its.filter((it) => { const a = actionsFor(it).find((y) => y.id === first.id); if (a) a.run(arg); return !!a; });
  if (recs.length === m.len) { render(); return true; }   // a focus move or an edit that is not a record yet
  if (failNext) {
    failNext = false; rollback(m);
    lastError = { key: hit[0].key, text: `The tracker did not answer, so "${first.label}" on ${hit[0].ref} was put back as it was. Check your connection and try again.` };
    toast({ text: `Could not save "${first.label}" on ${hit[0].ref}. Nothing was recorded.`, err: true, action: { label: 'Try again', run: () => act(first.id, arg) } });

  render();
  return true;
}

const undoStack = [];
function undo() {
  const m = undoStack.pop();

  rollback(m);

  if (view === 'replay') view = prevView;

}

// A new item is filed in one of the trackers and arrives in Triage like any other.
function createItem(source, title) {

function cfd(points) {

const cfdCache = new Map();

// ---------- chain lines (board) ----------

// Lines from each dependency to the item that waits on it. They run in the
// gutters between columns and, to pass a column, under its last card, so they
// never cross a card's text.
let segments = [];
function drawLinks(chain) {
  const svg = $('links');
  svg.innerHTML = '';
  segments = [];
  if (!chain || view !== 'board' || getComputedStyle(svg).display === 'none') return;
  const board = $('board');
  const b = board.getBoundingClientRect();
  const colEls = [...board.querySelectorAll('.col')];
  const cols = colEls.map((c) => { const r = c.getBoundingClientRect(); return { l: r.left - b.left, r: r.right - b.left, b: r.bottom - b.top }; });
  const pos = (k) => {
    const el = board.querySelector(`.row[data-k="${CSS.escape(k)}"]`);
    if (!el) return null;
    const r = el.getBoundingClientRect();
    return { l: r.left - b.left, r: r.right - b.left, y: r.top - b.top + r.height / 2, col: colEls.indexOf(el.closest('.col')) };
  };
  const gutter = (i, side) => {
    const j = side < 0 ? i - 1 : i;
    if (j < 0) return cols[0].l - 5;
    if (j >= cols.length - 1) return cols[cols.length - 1].r + 5;
    return (cols[j].r + cols[j + 1].l) / 2;
  };
  const round = (pts) => {
    let d = `M${pts[0][0]},${pts[0][1]}`;
    for (let i = 1; i < pts.length - 1; i++) {
      const [px, py] = pts[i - 1], [x, y] = pts[i], [nx, ny] = pts[i + 1];
      const r = Math.min(5, Math.hypot(x - px, y - py) / 2, Math.hypot(nx - x, ny - y) / 2);
      const u = (a, b2) => Math.sign(b2 - a);
      d += ` L${x - u(px, x) * r},${y - u(py, y) * r} Q${x},${y} ${x + u(x, nx) * r},${y + u(y, ny) * r}`;
    }
    const e = pts[pts.length - 1];
    return d + ` L${e[0]},${e[1]}`;
  };
  let out = '';
  for (const k of chain.all) {
    const to = pos(k);
    for (const d of state.items.get(k).deps) {
      if (!chain.all.has(d)) continue;
      const from = pos(d);
      if (!from || !to) continue;
      const dir = to.col < from.col ? -1 : 1;
      const same = from.col === to.col;
      const g1 = gutter(from.col, same ? 1 : dir), g2 = gutter(to.col, same ? 1 : -dir);
      const sx = (same || dir > 0) ? from.r : from.l;
      const tx = (same || dir < 0) ? to.r : to.l;
      const pts = [[sx, from.y], [g1, from.y]];
      if (Math.abs(g1 - g2) > 1) {
        const lo = Math.min(from.col, to.col) + 1, hi = Math.max(from.col, to.col) - 1;
        const between = cols.slice(lo, hi + 1);
        const y = between.length ? Math.max(...between.map((c) => c.b)) + 7 : null;
        if (y !== null) pts.push([g1, y], [g2, y]);
      }
      pts.push([g2, to.y], [tx, to.y]);
      for (let i = 1; i < pts.length; i++) segments.push([...pts[i - 1], ...pts[i]]);
      out += `<path d="${round(pts)}"></path><circle cx="${sx}" cy="${from.y}" r="3"></circle><circle cx="${tx}" cy="${to.y}" r="3"></circle>`;
    }
  }
  svg.innerHTML = out;
}


// ---------- decision replay ----------
// Everything on screen here is a field some agent or person recorded. The
// dashboard generates no text: the panel shows the nearest decision's so_far,
// the decision and the why, and the handoff is that so_far plus edits.

const GROUPS = [['understand', 'Understand'], ['reproduce', 'Reproduce'], ['cause', 'Cause'], ['fix', 'Fix'], ['verify', 'Verify']];
const PATH_KINDS = new Set(['decision', 'edit', 'tool', 'human_input', 'forked_from']);

  published: ['ready', 'pub'], picked: ['picked', 'ok'], closed: ['closed', 'rej'], stopped: ['stopped', 'rej'],
};
const redoLimit = () => settings.redoLimit ?? 3;

let dialog = null;       // the open redo or handoff dialog

const itemRecsCache = new Map();
function itemRecs(key) {

const hasHistory = (it) => !!it && itemRecs(it.key).some((r) => r.kind === 'decision');

  kinds: [...new Set(recs.map((r) => r.kind))],
  sources: Object.keys(fx.sources).filter((s) => Object.values(fx.items).some((i) => i.source === s)),
  agents: [...new Set(recs.filter((r) => r.agent).map((r) => r.agent))],
  tiers: [...new Set(recs.filter((r) => r.kind === 'triaged').map((r) => r.tier))],
  items: Object.keys(fx.items).length,
  ...lastInfo,
  view,
  title: document.title,
  queue: { count: queue.rows.length, kinds: queue.kinds, rows: document.querySelectorAll('#qlist .qrow').length },
  review: { count: by.review.length, cap: settings.reviewCap, full: settings.reviewCap != null && by.review.length >= settings.reviewCap },
  binding: binding ? binding.label : null,
  bindingStage: binding ? binding.stage : null,
  localEvents: localEvents.map((r) => r.kind),
  links: $('links').querySelectorAll('path').length,
  // Chain segments crossing a card that is not in the chain.
  crossings: (() => {
    const b = $('board').getBoundingClientRect();
    const rows = [...document.querySelectorAll('#board .row:not(.chain):not(.sel)')].map((e) => { const r = e.getBoundingClientRect(); return [r.left - b.left, r.top - b.top, r.right - b.left, r.bottom - b.top]; });
    return segments.filter(([x1, y1, x2, y2]) => rows.some(([l, t, r, bt]) => Math.max(x1, x2) > l && Math.min(x1, x2) < r && Math.max(y1, y2) > t && Math.min(y1, y2) < bt)).length;
  })(),
  chain: selected ? [...chainOf(state, selected).all] : [],
});
window.openReplay = (key, o) => openReplay(key, o);
window.explainAt = (key, n, o, extra = []) => {
  const path = pathOf(state.items.get(key), n);
  return explainAt(key, n, path.findIndex((r) => r.o === o), extra);
};
window.replayInfo = () => {
  const it = state.items.get(replay?.key ?? selected);
  if (!it) return null;
  const forks = [...document.querySelectorAll('#forks path')].map((p) => ({ at: +p.dataset.at, to: +p.dataset.to, x1: +p.dataset.x1, x2: +p.dataset.x2 }));
  const dot = (o) => { const e = document.querySelector(`#path .dot[data-o="${o}"]`); if (!e) return null; const r = e.getBoundingClientRect(); return { slot: +e.dataset.slot, x: r.left + r.width / 2, n: +e.dataset.n }; };
  return {
    view, redos: it.redos ?? 0, limit: redoLimit(), paths: it.paths?.map((b) => ({ n: b.n, parent: b.parent, at: b.at, state: b.state, by: b.by })) ?? [],
    forks, dots: Object.fromEntries(it.paths.filter((b) => b.at != null).flatMap((b) => [b.at, ...it.paths.filter((x) => x.parent === b.n).map((x) => x.at)]).map((o) => [o, dot(o)])),
    firstDot: Object.fromEntries(it.paths.map((b) => { const e = document.querySelector(`#path .lane[data-n="${b.n}"] .dots .cellp.first`); if (!e) return [b.n, null]; const r = e.getBoundingClientRect(); return [b.n, { x: r.left + r.width / 2, slot: +(e.style.gridColumn.split('/')[0] || 0) }]; })),
    sentences: [...document.querySelectorAll('#explain .sent')].map((p) => ({ text: p.textContent, cites: p.querySelectorAll('.cite').length })),
    explainText: $('explain')?.textContent ?? '', idx: replay?.idx, released: replay?.released,
    flags: allFlags(it).map((f) => ({ o: f.o, kind: f.kind })), state: it.stage, cost: it.cost,
    questions: (it.questions ?? []).map((q) => ({ answered: !!q.answer, cites: q.answer?.cites ?? [] })),
    handoffs: itemRecs(it.key).filter((r) => r.kind === 'handoff').map((h) => h.attempt),
    lastPathState: it.paths?.at(-1)?.state,
  };
};
render();
if (params.has('story')) {
  openReplay(params.get('story'), { n: params.has('branch') ? +params.get('branch') : undefined, d: params.has('d') ? +params.get('d') : undefined, tab: params.get('tab') ?? 'story', released: params.get('released') !== '0' });
  if (params.get('redo')) { const d = nearestDecision(); if (d && openRedo(d)) { dialog.instruction = params.get('note') ?? ''; drawModal(); } }
  if (params.get('cite')) { replay.cite = +params.get('cite'); renderReplay(); }
}
// ---------- autoplay demo (?demo=1) ----------
// Plays fixture-work-demo.json's beats into the log while the real keys drive
// the real views. The recorder owns the clock with &rec=1 and calls
// demo.advance(ms) per frame, so a recording never depends on wall time.

const clock = { t: 0, timers: [], starts: new WeakMap() };
const sleep = (ms) => new Promise((ok) => clock.timers.push({ at: clock.t + ms, ok }));
const macrotask = () => new Promise((ok) => setTimeout(ok, 0));
const demo = { loops: 0, errors: [], running: false, advance: null, runs: [] };

// Animations follow the demo clock when recording; otherwise they run normally.
function syncAnims() {
  if (!REC) return;
  for (const a of document.getAnimations()) {
    if (!clock.starts.has(a)) { clock.starts.set(a, clock.t - (Number(a.currentTime) || 0)); a.pause(); }
    a.currentTime = clock.t - clock.starts.get(a);
  }
}
function anim(el, frames, opts) {
  const a = el.animate(frames, { easing: 'cubic-bezier(.3,.1,.2,1)', fill: 'backwards', ...opts });
  syncAnims();
  return a;
}

function snapshot() {
  const rows = new Map();
  for (const e of document.querySelectorAll('#board .row[data-k], #qlist .qrow[data-k]')) rows.set(e.dataset.k, e.getBoundingClientRect());
  const counts = new Map();
  for (const e of document.querySelectorAll('#board .col h2 .n')) counts.set(e.closest('.col').id, e.textContent);
  return { view, rows, counts, modal: !!dialog };
}
function render() {
  if (!DEMO || !state) { renderNow(); return; }
  const before = snapshot();
  renderNow();
  if (before.view !== view) { anim($('main'), [{ opacity: 0 }, { opacity: 1 }], { duration: 420 }); return; }
  for (const e of document.querySelectorAll('#board .row[data-k], #qlist .qrow[data-k]')) {
    const was = before.rows.get(e.dataset.k), now = e.getBoundingClientRect();
    if (!was) { anim(e, [{ opacity: 0, transform: 'translateY(14px)' }, { opacity: 1, transform: 'none' }], { duration: 650 }); continue; }
    const dx = was.left - now.left, dy = was.top - now.top;
    if (Math.abs(dx) > 1 || Math.abs(dy) > 1) {
      e.style.zIndex = 5;
      anim(e, [{ transform: `translate(${dx}px, ${dy}px)` }, { transform: 'none' }], { duration: 900, easing: 'cubic-bezier(.45,0,.2,1)' }).finished.then(() => { e.style.zIndex = ''; }, () => {});
    }
  }
  for (const e of document.querySelectorAll('#board .col h2 .n')) {
    const was = before.counts.get(e.closest('.col').id);
    if (was != null && was !== e.textContent) anim(e, [{ transform: 'scale(1.5)', color: 'var(--accent)' }, { transform: 'none' }], { duration: 700 });
  }
  if (dialog && !before.modal) anim(document.querySelector('#modal .dlg'), [{ opacity: 0, transform: 'translateY(10px) scale(.98)' }, { opacity: 1, transform: 'none' }], { duration: 380 });
}

// Beat records name earlier records as "@id"; the log gives them offsets as they are added.
const ids = new Map();
const resolveIds = (v) => {
  if (typeof v === 'string' && v[0] === '@') { if (!ids.has(v.slice(1))) throw new Error(`unknown record ${v}`); return ids.get(v.slice(1)); }
  if (Array.isArray(v)) return v.map(resolveIds);
  if (v && typeof v === 'object') return Object.fromEntries(Object.entries(v).map(([k, x]) => [k, resolveIds(x)]));
  return v;
};
function push(beat, over = {}, gapMs = 0) {
  return (async () => {
    for (const b of fx.beats[beat]) {
      const { dt, id, ...rest } = b;
      NOW += dt;
      const r = resolveIds({ o: recs.length, t: NOW, ...rest, ...(rest.agent && over.agent ? { agent: over.agent } : {}) });
      recs.push(r);
      if (id) ids.set(id, r.o);
      cut = NOW;
      render();
      if (gapMs) await sleep(gapMs);
    }
  })();
}

let capNow = '', keyTimer = 0;
function caption(text) {
  const c = $('demo-cap');
  if (text === capNow) return;
  capNow = text;
  if (!text) { anim(c, [{ opacity: 1 }, { opacity: 0 }], { duration: 300, fill: 'forwards' }); return; }
  c.textContent = text;
  anim(c, [{ opacity: 0, transform: 'translate(-50%, 8px)' }, { opacity: 1, transform: 'translate(-50%, 0)' }], { duration: 400, fill: 'both' });
}
async function press(k, label, o = {}) {
  const el = $('demo-key');
  const keys = k.split(' ');
  el.innerHTML = `${(o.shift ? ['shift', ...keys] : keys).map((x) => `<kbd>${x}</kbd>`).join('')}<span>${label}</span>`;
  const mine = ++keyTimer;
  anim(el, [{ opacity: 0 }, { opacity: 1 }], { duration: 160, fill: 'both' });
  await sleep(180);
  for (const key of keys) document.body.dispatchEvent(new KeyboardEvent('keydown', { key, shiftKey: !!o.shift, bubbles: true }));
  sleep(750).then(() => { if (mine === keyTimer) anim(el, [{ opacity: 1 }, { opacity: 0 }], { duration: 250, fill: 'forwards' }); });
}

const BASE_LEN = recs.length;
const FADE = 500;
function resetDemo() {
  recs.length = BASE_LEN; itemRecsCache.clear(); localEvents.length = 0; ids.clear();
  NOW = fx.now; cut = NOW; selected = null; view = 'board'; dialog = null; replay = null; prevView = 'queue';
  pending.clear(); expanded.clear(); checked.clear(); undoStack.length = 0; filters = noFilters(); activeView = null; capNow = '';
  $('demo-cap').style.opacity = 0; $('demo-key').style.opacity = 0;
  drawModal();
  render();
}

async function story() {
  const began = clock.t;
  const fade = (from, to) => anim(document.body, [{ opacity: from }, { opacity: to }], { duration: FADE, fill: 'both', easing: 'ease-in-out' });
  const holder = () => state.items.get('gh-801').holder;
  fade(0, 1);
  await sleep(250);

  caption('Bugs arrive from GitHub, Azure DevOps and Jira.');
  await push('arrive_gh'); await sleep(900);
  await push('arrive_ado'); await sleep(900);
  await push('arrive_jira'); await sleep(900);

  caption('An agent proposes a tier. One key accepts it.');
  await press('g i', 'my queue'); await sleep(500);
  await press('j', 'next'); await sleep(500);
  for (let i = 0; i < 3; i++) { await press('1', 'accept'); await sleep(i < 2 ? 500 : 700); }

  caption('Accepted work is Ready. Agents claim it.');
  await press('g b', 'board'); await sleep(800);
  await push('claim_gh'); await sleep(450);
  await push('claim_ado'); await sleep(450);
  await push('claim_jira'); await sleep(800);

  caption('A claim lapsed, so the item went to another agent.');
  await push('lapse_ado'); await sleep(900);
  await push('reclaim_ado'); await sleep(1000);

  caption('The fix lands in review with its handoff.');
  await push('work_gh'); await push('pr_gh'); await sleep(500);
  await push('pr_ado'); await sleep(700);
  await press('g i', 'my queue'); await sleep(500);
  await press('j', 'next'); await sleep(1600);

  caption('Open the story and scrub back to any decision.');
  await press('Enter', 'story'); await sleep(800);
  const slider = $('rscrub');
  const last = +slider.value;
  const target = curPath().findIndex((r, i, p) => r.kind === 'decision' && p.slice(0, i + 1).filter((x) => x.kind === 'decision').length === 3);
  const steps = 24;
  for (let i = 1; i <= steps; i++) {
    const e = i / steps, ease = e * e * (3 - 2 * e);
    slider.value = Math.round(last + (target - last) * ease);
    slider.dispatchEvent(new Event('input', { bubbles: true }));
    await sleep(33);
  }
  await sleep(150);
  slider.dispatchEvent(new Event('change', { bubbles: true }));
  caption('Let go: what it knew, what it chose, and why.');
  await sleep(2500);

  caption('Redo from that decision to branch the path.');
  await press('r', 'redo from here'); await sleep(400);
  const box = $('instr'), text = fx.redo.instruction;
  for (let i = 1; i <= text.length; i++) {
    box.value = text.slice(0, i);
    box.dispatchEvent(new Event('input', { bubbles: true }));
    await sleep(12);
  }
  await sleep(500);
  $('go').classList.add('pressed');
  await sleep(160);
  $('go').click();
  ids.set('redo', recs.findLast((r) => r.kind === 'human_input' && r.item === 'gh-801').o);
  await sleep(900);
  claimRedo('gh-801', 2);
  await sleep(400);
  const agent = holder();
  await push('work_gh2', { agent }, 100);
  await push('pr_gh2', { agent }); await sleep(800);

  caption('The fix merges and Done ticks up.');
  await press('1', 'approve'); await sleep(700);
  await press('1', 'mark merged'); await sleep(800);
  await press('Escape', 'back'); await sleep(350);
  await press('g b', 'board'); selected = null; render(); await sleep(1500);

  demo.runs.push({ seconds: Math.round((clock.t - began + FADE + 250) / 100) / 10, events: localEvents.map((r) => r.kind), done: by.done.length });
  caption('');
  fade(1, 0);
  await sleep(FADE + 250);
}

async function run() {
  demo.running = true;
  try {
    for (;;) {
      await story();
      demo.loops++;
      resetDemo();
      if (REC && demo.loops >= (Number(params.get('loops')) || 1)) break;
    }
  } catch (e) {
    demo.errors.push(String(e.stack || e));
    console.error('demo failed: ' + (e.stack || e));
  }
  demo.running = false;
}

if (DEMO) {
  document.body.classList.add('demo');
  if (!params.has('view')) { view = 'board'; render(); }
  window.demo = demo;
  const advance = async (ms) => {
    const target = clock.t + ms;
    for (;;) {
      let next = null;
      for (const t of clock.timers) if (t.at <= target && (!next || t.at < next.at)) next = t;
      if (!next) break;
      clock.timers.splice(clock.timers.indexOf(next), 1);
      clock.t = Math.max(clock.t, next.at);
      next.ok();
      await macrotask();
    }
    clock.t = target;
    syncAnims();
    demo.t = clock.t;
  };
  demo.advance = advance;
  demo.start = () => { if (!demo.running) run(); };
  if (!REC) {
    demo.start();
    let last = performance.now();
    const frame = (now) => { advance(Math.min(100, now - last)); last = now; requestAnimationFrame(frame); };
    requestAnimationFrame(frame);
  }
}
</script>
