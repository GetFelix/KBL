name: Release

# A `v*` tag builds kbl-mcp and kbl-tool for every platform, attests each
# archive and the checksums, and publishes them as a GitHub release. It also
# builds the tracker (with kbl-ingest) and dashboard images for amd64 and
# arm64, pushes them to ghcr.io/getfelix and attests them. A manual run with
# dry_run builds and uploads the archives as workflow artifacts, builds the
# images without pushing them, and creates no release. Run on a branch, it can never release: only a tag ref
# reaches the publish job.
on:
  push:
    tags:
      - "v*"
  # A change to this file rehearses the whole build, so a broken target shows
  # up in the pull request instead of at the next tag.
  pull_request:
    paths:
      - .github/workflows/release.yml
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build every target and keep the archives as artifacts; create no release
        required: false
        default: true
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The binaries report the workspace version, so a tag that disagrees with it
  # would ship archives named for one version that print another.
  version:
    name: check the version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a plain tag on main
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in */*) echo "tag name must not contain a slash"; exit 1;; esac
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "$TAG is not on main"; exit 1; }
      - name: Tag matches the workspace version
        env:
          REF_NAME: ${{ github.ref_name }}
          IS_TAG: ${{ github.ref_type == 'tag' }}
        run: |
          versions=$(cargo metadata --no-deps --locked --format-version 1 \
            | jq -r '.packages[].version' | sort -u)
          [ "$(echo "$versions" | wc -l)" -eq 1 ] \
            || { echo "workspace crates disagree on the version:"; echo "$versions"; exit 1; }
          echo "workspace version: $versions"
          if [ "$IS_TAG" = true ] && [ "$REF_NAME" != "v$versions" ]; then
            echo "tag $REF_NAME does not match workspace version $versions; bump it first"
            exit 1
          fi

  build:
    name: build ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04, ext: tar.gz }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm, ext: tar.gz }
          - { target: aarch64-apple-darwin, os: macos-latest, ext: tar.gz }
          # Built on the arm runner: Intel macOS runners are being retired.
          - { target: x86_64-apple-darwin, os: macos-latest, ext: tar.gz }
          - { target: x86_64-pc-windows-msvc, os: windows-2022, ext: zip }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Name the archives
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          IS_TAG: ${{ github.ref_type == 'tag' }}
        run: |
          if [ "$IS_TAG" = true ]; then
            echo "version=$REF_NAME" >> "$GITHUB_ENV"
          else
            echo "version=dev-$(git rev-parse --short=12 HEAD)" >> "$GITHUB_ENV"
          fi
      - run: rustup update stable && rustup default stable && rustup target add ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p kbl-mcp -p kbl-tool
      - name: Check the binary starts
        # The Intel macOS binary is cross-built and the runner is arm.
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          ext=""; [ "${{ runner.os }}" = Windows ] && ext=.exe
          bin=target/${{ matrix.target }}/release
          "$bin/kbl-mcp$ext" --help > /dev/null
          "$bin/kbl-tool$ext" --help > /dev/null
      - name: Package
        shell: bash
        run: |
          name="kbl-${version}-${{ matrix.target }}"
          ext=""; [ "${{ runner.os }}" = Windows ] && ext=.exe
          mkdir -p "dist/$name"
          for b in kbl-mcp kbl-tool; do
            cp "target/${{ matrix.target }}/release/$b$ext" "dist/$name/"
          done
          cp LICENSE README.md "dist/$name/"
          cd dist
          if [ "${{ matrix.ext }}" = zip ]; then
            7z a "$name.zip" "$name" > /dev/null
          else
            tar -czf "$name.tar.gz" "$name"
          fi
          rm -rf "$name"
          ls -l
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kbl-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  checksums:
    name: checksums
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Only the release files: the image archives share the run.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: kbl-*
          path: dist
          merge-multiple: true
      - name: Require the archives
        run: |
          ls -l dist || true
          n=$(find dist -maxdepth 1 -type f \( -name 'kbl-*.tar.gz' -o -name 'kbl-*.zip' \) 2>/dev/null | wc -l)
          [ "$n" -eq 5 ] || { echo "expected 5 archives in dist, found $n"; exit 1; }
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum kbl-*.tar.gz kbl-*.zip > SHA256SUMS
          sha256sum --check SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  # Signs with the run's OIDC identity, so it is the only job with id-token.
  # Verify with: gh attestation verify <file> -R GetFelix/KBL
  attest:
    name: attest archives
    needs: checksums
    if: >-
      github.ref_type == 'tag' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      # Only the release files: the image archives share the run.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: kbl-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: SHA256SUMS
          path: dist
      - name: Require the archives
        run: |
          ls -l dist || true
          n=$(find dist -maxdepth 1 -type f \( -name 'kbl-*.tar.gz' -o -name 'kbl-*.zip' \) 2>/dev/null | wc -l)
          [ "$n" -eq 5 ] || { echo "expected 5 archives in dist, found $n"; exit 1; }
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

  publish:
    name: publish release
    needs: attest
    # Only a tag publishes: a push of it, or a manual run on it with dry_run
    # off (to retry a release whose publish step failed).
    if: >-
      github.ref_type == 'tag' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # Only the release files: the image archives share the run.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: kbl-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: SHA256SUMS
          path: dist
      - name: Require the archives
        run: |
          ls -l dist || true
          n=$(find dist -maxdepth 1 -type f \( -name 'kbl-*.tar.gz' -o -name 'kbl-*.zip' \) 2>/dev/null | wc -l)
          [ "$n" -eq 5 ] || { echo "expected 5 archives in dist, found $n"; exit 1; }
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$REPO" --verify-tag --title "$TAG" --generate-notes

  # Each image is built natively per architecture, because compiling the
  # tracker and the dashboard's wasm under emulation takes hours. Nothing is
  # pushed here, so this job has no package permission and a dry run is the
  # same code path as a release.
  image-build:
    name: image ${{ matrix.component }} ${{ matrix.arch }}
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        component: [tracker, dashboard]
        arch: [amd64, arm64]
        include:
          - { arch: amd64, os: ubuntu-24.04 }
          - { arch: arm64, os: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Image labels
        id: meta
        env:
          REF_NAME: ${{ github.ref_name }}
          IS_TAG: ${{ github.ref_type == 'tag' }}
        run: |
          if [ "$IS_TAG" = true ]; then v="${REF_NAME#v}"; else v="dev-$(git rev-parse --short=12 HEAD)"; fi
          {
            echo "labels<<EOF"
            echo "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}"
            echo "org.opencontainers.image.version=$v"
            echo "org.opencontainers.image.revision=${GITHUB_SHA}"
            echo "org.opencontainers.image.licenses=MIT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build the image archive
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.component }}/Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=oci,dest=${{ runner.temp }}/image.tar
          # One plain image manifest, so the archive loads and pushes as is.
          provenance: false
          sbom: false
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}-${{ matrix.arch }}
      - name: Install skopeo
        run: command -v skopeo || sudo apt-get install -y --no-install-recommends skopeo > /dev/null
      - name: Check the image starts
        # The archive that is checked is the one uploaded and pushed.
        run: |
          skopeo copy "oci-archive:${{ runner.temp }}/image.tar" \
            "docker-daemon:kbl-${{ matrix.component }}:check"
          if [ "${{ matrix.component }}" = tracker ]; then
            docker run --rm --entrypoint kbl-tracker kbl-tracker:check --help > /dev/null
            docker run --rm --entrypoint kbl-ingest kbl-tracker:check --help > /dev/null
          else
            docker run --rm --entrypoint ls kbl-dashboard:check /usr/share/nginx/html/index.html
            test "$(docker run --rm --entrypoint id kbl-dashboard:check -u)" != 0
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-${{ matrix.component }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/image.tar
          if-no-files-found: error
          retention-days: 1

  # The only job that pushes. It joins the two architectures under one tag and
  # attests the result by digest. Verify with:
  #   gh attestation verify oci://ghcr.io/getfelix/kbl-tracker:<version> -R GetFelix/KBL
  image-push:
    name: push ${{ matrix.component }} image
    needs: [image-build, publish]
    if: >-
      github.ref_type == 'tag' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        component: [tracker, dashboard]
    env:
      IMAGE: ghcr.io/getfelix/kbl-${{ matrix.component }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: image-${{ matrix.component }}-*
          path: images
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push both architectures and the joined tag
        id: push
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="${REF_NAME#v}"
          sudo apt-get install -y --no-install-recommends skopeo > /dev/null
          for arch in amd64 arm64; do
            skopeo copy --digestfile "$RUNNER_TEMP/$arch.digest" \
              "oci-archive:images/image-${{ matrix.component }}-$arch/image.tar" \
              "docker://$IMAGE:$version-$arch"
          done
          docker buildx imagetools create -t "$IMAGE:$version" \
            "$IMAGE@$(cat "$RUNNER_TEMP/amd64.digest")" "$IMAGE@$(cat "$RUNNER_TEMP/arm64.digest")"
          digest=$(docker buildx imagetools inspect "$IMAGE:$version" --format '{{.Manifest.Digest}}')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
