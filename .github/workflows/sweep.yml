name: Fault sweep

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      seeds:
        description: Seeds per sweep
        default: "5000"

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KBL_SWEEP_SEEDS: ${{ inputs.seeds || '5000' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: cargo test --locked -p kbl-tracker sweep
      - run: cargo test --locked -p kbl-ingest sweep
