name: tmp-lock
on:
  push:
    branches: [fa-wasm]
    paths: [".github/workflows/tmp-lock.yml"]
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate lockfile from registry.npmjs.org
        working-directory: dashboard
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --registry=https://registry.npmjs.org/
      - uses: actions/upload-artifact@v4
        with:
          name: lockfile
          path: dashboard/package-lock.json
