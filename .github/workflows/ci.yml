name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A merge's run on main is never cancelled by the next merge.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/lint.mjs
      # The fixtures are generated; the committed files must match the script.
      - run: python3 prototype/make-fixture.py
      - run: python3 prototype/make-intake-fixture.py
      - run: git diff --exit-code -- prototype

  frame:
    name: style frame
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Headless Chrome is preinstalled on the runner.
      - run: node scripts/check-frame.mjs

  intake:
    name: intake frame
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-intake.mjs

  motion:
    name: motion rules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-motion.mjs

  steps:
    name: step panel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-steps.mjs

  rust:
    name: rust
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  stack:
    name: dev stack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: dev/up.sh
      - run: node dev/check.mjs
      - name: Create a run, then refuse the same id again
        run: |
          cargo build -p agents-tool
          tool=target/debug/agents-tool
          "$tool" run create ci --goal "CI run" --budget-usd 1 --workers 2
          if "$tool" run create ci --goal "CI run" --budget-usd 1 --workers 2; then
            echo "a second create of the same run succeeded" >&2
            exit 1
          fi
      - name: Start felix-mcp and list its tools
        run: |
          cargo build -p felix-mcp
          node dev/check-mcp.mjs
      - if: failure()
        run: docker compose -f dev/compose.yml logs
      - if: always()
        run: dev/down.sh

  # The one check branch protection requires.
  ci-ok:
    name: CI ok
    if: always()
    needs: [lint, frame, motion, steps, rust, stack]
    runs-on: ubuntu-latest
    steps:
      - run: |
          test "${{ needs.lint.result }}" = success
          test "${{ needs.frame.result }}" = success
          test "${{ needs.motion.result }}" = success
          test "${{ needs.steps.result }}" = success
          test "${{ needs.rust.result }}" = success
          test "${{ needs.stack.result }}" = success
