name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A merge's run on main is never cancelled by the next merge.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node scripts/lint.mjs
      # The chart must lint and render with its minimal and full values, and
      # refuse to render without the values it requires.
      - name: Helm chart
        run: |
          for v in minimal full; do
            helm lint deploy/helm/kbl -f deploy/helm/kbl/ci/$v.yaml
            helm template kbl deploy/helm/kbl -f deploy/helm/kbl/ci/$v.yaml > /dev/null
          done
          helm template kbl deploy/helm/kbl -f deploy/helm/kbl/examples/values-production.yaml > /dev/null
          if helm template kbl deploy/helm/kbl > /dev/null 2>&1; then
            echo "the chart rendered without the values it requires"; exit 1
          fi
      # Every route, tool and record kind has a row in docs/threat-model.md.
      - run: node scripts/check-threat-model.mjs
      # A changed stored fold result in wasm/golden needs a changelog fragment naming it.
      - run: node scripts/check-golden.mjs origin/${{ github.base_ref }}
        if: github.event_name == 'pull_request'
      - run: node --test dev/lib/script.test.mjs dev/lib/agents.test.mjs
      # Malformed changelog fragments, and the assembler's own tests.
      - run: python3 scripts/changelog_assemble.py --check
      - run: python3 -m unittest scripts/test_changelog_assemble.py
      # The fixtures are generated; the committed files must match the script.
      - run: python3 prototype/make-intake-fixture.py
      - run: python3 prototype/make-demo-fixture.py
      - run: git diff --exit-code -- prototype

  intake:
    name: intake frame
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node scripts/check-intake.mjs

  rust:
    name: rust
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # A bounded run of the seeded fault sweeps; docs/fault-sweep.md.
      - run: cargo test --locked -p kbl-tracker -p kbl-ingest sweep
        env:
          KBL_SWEEP_SEEDS: 400

  dashboard:
    name: dashboard build (wasm, tsc, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - id: bindgen
        run: echo "version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')" >> "$GITHUB_OUTPUT"
      - name: Install the wasm-bindgen CLI at the locked version
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2
        with:
          tool: wasm-bindgen@${{ steps.bindgen.outputs.version }}
      - run: npm ci --ignore-scripts
        working-directory: dashboard
      - run: npm run wasm
        working-directory: dashboard
      - run: npm run typecheck
        working-directory: dashboard
      - run: npm test
        working-directory: dashboard
      - run: npm run build
        working-directory: dashboard
      - name: Keyboard flows and axe-core in headless Chrome
        run: npm run check
        working-directory: dashboard

  stack:
    name: dev stack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: dev/up.sh
      - run: node dev/check.mjs
      - name: Create a run, then refuse the same id again
        run: |
          cargo build --locked -p kbl-tool
          tool=target/debug/kbl-tool
          "$tool" run create ci --goal "CI run" --budget-usd 1 --workers 2
          if "$tool" run create ci --goal "CI run" --budget-usd 1 --workers 2; then
            echo "a second create of the same run succeeded" >&2
            exit 1
          fi
      - name: Start kbl-mcp and list its tools
        run: |
          cargo build --locked -p kbl-mcp
          node dev/check-mcp.mjs
      - name: Run the task tools against Felix
        run: node dev/check-tasks.mjs
      - name: Run the tracker's claim path against Felix
        run: |
          cargo build --locked -p kbl-tool -p kbl-mcp -p kbl-tracker
          node dev/check-tracker-claims.mjs
      - name: Poll one issue again and again, and import it once
        run: |
          cargo build --locked -p kbl-ingest
          node dev/check-tracker-ingest.mjs
      - name: Run the work tools against Felix
        run: node dev/check-tracker-work.mjs
      - name: Create teams and keep them apart
        run: |
          cargo build --locked -p kbl-tool --example raw_felix
          node dev/check-teams.mjs
      - name: Run review as work against Felix
        run: node dev/check-tracker-review.mjs
      - name: Run triage as work against Felix
        run: node dev/check-tracker-triage.mjs
      - name: Run three agent sessions from the launcher until the queue is empty
        run: node dev/check-agents.mjs
      - name: Upgrade from the previous build and back, over one log
        env:
          # The previous build is the commit this change is based on, until there are releases.
          PREVIOUS: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A commit between the previous build and this one may declare that
          # the two cannot run together (see docs/upgrades.md).
          git fetch --unshallow origin 2>/dev/null || git fetch origin
          git fetch origin "$PREVIOUS"
          if declared=$(git log "$PREVIOUS..HEAD" --format=%B | grep -m1 '^Upgrade-Break:'); then
            echo "Skipping the upgrade check. $declared"
            exit 0
          fi
          git worktree add ../previous "$PREVIOUS"
          # Builds from before the rename have agents-tracker and felix-mcp.
          if grep -q '^name = "kbl-tracker"' ../previous/tracker/Cargo.toml; then
            TRACKER=kbl-tracker; MCP=kbl-mcp
          else
            TRACKER=agents-tracker; MCP=felix-mcp
          fi
          cargo build --locked --manifest-path ../previous/Cargo.toml --target-dir target/previous -p "$TRACKER" -p "$MCP"
          KBL_TRACKER_OLD="target/previous/debug/$TRACKER" KBL_MCP_OLD="target/previous/debug/$MCP" \
            node dev/check-upgrade.mjs
      - name: Run a scripted job twice from one seed
        run: node dev/check-scripted.mjs
      - name: Kill workers holding tasks
        run: node dev/check-death.mjs
      - name: Dead-letter a poison task
        run: node dev/check-poison.mjs
      # After the checks that share this log, since it raises the format to 21.
      - name: Supervise a pool of fake workers until the queue is empty
        run: |
          cargo build --locked -p kbl-mcp -p kbl-tool -p kbl-tracker
          node dev/check-supervise.mjs
      # On a stack of its own with 20 s tokens, then the stack is recreated as it was.
      - name: Outlive the first Felix token, holding a claim
        run: |
          cargo build --locked -p kbl-tool -p kbl-mcp
          KBL_DEV_TOKEN_TTL_SECONDS=20 dev/up.sh
          node dev/check-renewal.mjs
          dev/up.sh
      # Last, because it recreates the stack.
      - name: Back up, restore into a fresh stack, and compare the folds
        run: |
          cargo build --locked -p kbl-mcp -p kbl-tool -p kbl-tracker
          node dev/check-backup.mjs
      - if: failure()
        run: docker compose -f dev/compose.yml logs
      - if: always()
        run: dev/down.sh

  quickstart:
    name: quick start
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Full build output in the log, so a failed image build can be read.
      BUILDKIT_PROGRESS: plain
      COMPOSE_PROGRESS: plain
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # What the README's quick start tells a new machine to run. The budget is
      # the cold build (no cache) plus the wait for every service; the README
      # promises about 10 minutes.
      - name: Quick start, cold
        run: |
          start=$SECONDS
          dev/quickstart.sh 2>&1 | tee quickstart.log
          took=$((SECONDS - start))
          echo "quick start took ${took}s"
          test "$took" -le 900 || { echo "over the 900s budget"; exit 1; }
      - run: cargo build --locked --release -p kbl-mcp -p kbl-ingest
      - run: node dev/check-quickstart.mjs
      - if: failure()
        run: docker compose -f dev/compose.yml --profile quickstart logs
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quickstart-log
          path: quickstart.log
      - if: always()
        run: dev/down.sh

  # Optional: runs only when the repository variable KBL_IMAGE_TAG names a
  # published release. Not part of CI ok, since the images exist after a tag.
  quickstart-images:
    name: quick start, published images
    if: vars.KBL_IMAGE_TAG != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KBL_IMAGE_TAG: ${{ vars.KBL_IMAGE_TAG }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: dev/quickstart.sh
      - run: cargo build --locked --release -p kbl-mcp -p kbl-ingest
      - run: node dev/check-quickstart.mjs
      - if: always()
        run: dev/down.sh

  # The one check branch protection requires.
  ci-ok:
    name: CI ok
    if: always()
    needs: [lint, intake, rust, dashboard, stack, quickstart]
    runs-on: ubuntu-latest
    steps:
      - run: |
          test "${{ needs.lint.result }}" = success
          test "${{ needs.intake.result }}" = success
          test "${{ needs.rust.result }}" = success
          test "${{ needs.dashboard.result }}" = success
          test "${{ needs.stack.result }}" = success
          test "${{ needs.quickstart.result }}" = success
