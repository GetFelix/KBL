# The development stack: a control plane, one broker, a stand-in IdP, a
# one-shot seed that creates the tenant, and the gateway. `dev/up.sh` starts
# it and waits until it is ready.
name: kbl

services:
  idp:
    image: docker.io/library/node:24-alpine
    command: ["node", "/app/idp.mjs"]
    environment:
      # Browsers sign in on the host, so the issuer is the host's address.
      IDP_ISSUER: http://127.0.0.1:9400
    ports:
      - "127.0.0.1:9400:9400"
    volumes:
      - ./idp.mjs:/app/idp.mjs:ro,z
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9400/jwks.json"]
      interval: 2s
      timeout: 2s
      retries: 15

  controlplane:
    image: ghcr.io/getfelix/felix-controlplane:0.7.2
    environment:
      # In-memory store: a restart of the stack starts from nothing.
      FELIX_BOOTSTRAP_ENABLED: "true"
      FELIX_BOOTSTRAP_BIND_ADDR: 0.0.0.0:9095
      FELIX_BOOTSTRAP_TOKEN: dev-bootstrap
      # The dev IdP is plain HTTP on the compose network.
      FELIX_CONTROLPLANE_OIDC_ALLOW_INSECURE_HTTP: "true"
      # The broker reads its token once at startup, so the default 15 minutes
      # would end a dev session early. dev/check-renewal.mjs sets it short.
      FELIX_EXCHANGE_TOKEN_TTL_SECONDS: "${KBL_DEV_TOKEN_TTL_SECONDS:-86400}"
      RUST_LOG: info
    ports:
      - "127.0.0.1:8443:8443"
    # Spelled out because Podman drops a healthcheck an image declares in OCI format.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/ready"]
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      idp:
        condition: service_healthy

  seed:
    image: docker.io/library/node:24-alpine
    command: ["node", "/app/seed.mjs"]
    volumes:
      - ./seed.mjs:/app/seed.mjs:ro,z
      - ./state:/state:z
    depends_on:
      controlplane:
        condition: service_healthy

  broker:
    image: ghcr.io/getfelix/felix-broker:0.7.2
    environment:
      FELIX_CONTROLPLANE_URL: http://controlplane:8443
      FELIX_NODE_TOKEN_FILE: /state/node.token
      FELIX_DURABLE_STORAGE_DIR: /var/lib/felix
      FELIX_TLS_CERT_EXPORT: /state/broker-cert.pem
      # Joining as a cluster of one is what lets a stream, cache or counter
      # have its shards placed and its leases held.
      FELIX_NODE_ID: broker-0
      # Peers reach the internal listener here; with one node there are none.
      FELIX_NODE_ADVERTISE_ADDR: 127.0.0.1:5001
      FELIX_INTERNAL_ALLOW_UNAUTHENTICATED: "true"
      # One listener, so the one published UDP port is the only one clients use.
      FELIX_QUIC_LISTENERS: "1"
      # Acknowledge after the write, so an ack carries the record's log offset.
      FELIX_ACK_ON_COMMIT: "true"
      # With one copy, an acknowledged record must survive a power cut too
      # (docs/work-tracker.md, "What Felix must guarantee").
      FELIX_DURABLE_FSYNC_MODE: on_commit
      RUST_LOG: info
    ports:
      - "127.0.0.1:5000:5000/udp"
      - "127.0.0.1:8080:8080"
    volumes:
      - ./state:/state:z
      - felix-data:/var/lib/felix
    depends_on:
      seed:
        condition: service_completed_successfully

  # A cluster member serves atomic commits only once the fleet has finalized
  # them, which needs a serving broker.
  finalize:
    image: docker.io/library/node:24-alpine
    command: ["node", "/app/finalize.mjs"]
    environment:
      KBL_FELIX_CONTROL_PLANE: http://controlplane:8443
    volumes:
      - ./finalize.mjs:/app/finalize.mjs:ro,z
      - ./state:/state:z
    depends_on:
      broker:
        condition: service_started

  gateway:
    image: ghcr.io/getfelix/felix-gateway:0.9.0
    environment:
      GATEWAY_FELIX_BROKERS: broker:5000
      GATEWAY_FELIX_CA_FILE: /state/broker-cert.pem
      GATEWAY_FELIX_CONTROL_PLANE: http://controlplane:8443
      GATEWAY_TENANT: agents
      GATEWAY_OIDC_ISSUER: http://127.0.0.1:9400
      GATEWAY_OIDC_CLIENT_ID: kbl
      RUST_LOG: info
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ./scope.toml:/etc/felix-gateway/scope.toml:ro,z
      - ./state:/state:ro,z
    # It reads the broker's certificate, which exists once the broker has started.
    restart: on-failure
    depends_on:
      finalize:
        condition: service_completed_successfully

  # The quick start (`dev/quickstart.sh`): the work tracker, the dashboard and a
  # gateway for it, built from this checkout. Published on loopback only.
  tracker:
    profiles: [quickstart]
    # KBL_IMAGE_TAG (dev/up.sh) swaps in the published image; unset, this builds.
    image: ${KBL_TRACKER_IMAGE:-kbl-tracker}
    build:
      context: ..
      dockerfile: tracker/Dockerfile
    # The entrypoint reads the host's 0600 token file as root, then drops to the
    # unprivileged user kbl, so only the capabilities for that are kept.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETUID, SETGID]
    environment:
      KBL_TOKENS_SRC: /state/tracker-tokens.json
      KBL_FELIX_CONTROL_PLANE: http://controlplane:8443
      KBL_IDP: http://idp:9400
      KBL_FELIX_BROKER: broker:5000
      KBL_FELIX_CA_FILE: /state/broker-cert.pem
      KBL_FELIX_BROKER_NAME: localhost
      KBL_TRACKER_LISTEN: 0.0.0.0:8790
      # The proxy flag only lifts the loopback-only check inside the container:
      # the port is published to 127.0.0.1 and nothing else.
      KBL_TRACKER_BEHIND_TLS_PROXY: "true"
    ports:
      - "127.0.0.1:8790:8790"
    volumes:
      - ./state:/state:ro,z
    restart: on-failure
    depends_on:
      finalize:
        condition: service_completed_successfully

  dashboard:
    profiles: [quickstart]
    image: ${KBL_DASHBOARD_IMAGE:-kbl-dashboard}
    build:
      context: ..
      dockerfile: dashboard/Dockerfile
    # nginx exits if the tracker's name does not resolve yet.
    restart: on-failure
    # The image runs nginx as an unprivileged user, so it listens on 8080.
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      - tracker

  # The dashboard reads work.events through its own gateway, because a gateway
  # has one scope file and the one above is for runs.
  dashboard-gateway:
    profiles: [quickstart]
    image: ghcr.io/getfelix/felix-gateway:0.9.0
    environment:
      GATEWAY_FELIX_BROKERS: broker:5000
      GATEWAY_FELIX_CA_FILE: /state/broker-cert.pem
      GATEWAY_FELIX_CONTROL_PLANE: http://controlplane:8443
      GATEWAY_TENANT: agents
      GATEWAY_OIDC_ISSUER: http://127.0.0.1:9400
      GATEWAY_OIDC_CLIENT_ID: kbl
      RUST_LOG: info
    ports:
      - "127.0.0.1:8788:8787"
    volumes:
      - ./scope-work.toml:/etc/felix-gateway/scope.toml:ro,z
      - ./state:/state:ro,z
    restart: on-failure
    depends_on:
      finalize:
        condition: service_completed_successfully

volumes:
  felix-data:
