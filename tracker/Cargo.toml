[package]
name = "kbl-tracker"
version = "0.0.0"
description = "The work tracker: the only writer of work.events and the ready streams, and the claim path for agents"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "kbl-tracker"
path = "src/main.rs"

[dependencies]
kbl-core = { path = "../core" }
anyhow = "=1.0.100"
axum = { version = "=0.8.8", default-features = false, features = ["http1", "json", "tokio"] }
bytes = "=1.12.1"
clap = { version = "=4.5.51", features = ["derive", "env"] }
felix-client = "=0.6.2"
reqwest = { version = "=0.12.24", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread", "sync", "time", "net", "signal"] }
tower = { version = "=0.5.3", default-features = false, features = ["util"] }

[dev-dependencies]
tokio = { version = "=1.48.0", features = ["test-util"] }

[lints]
workspace = true
